<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071421">
<title>蒼海の盾 ― 機動護衛群司令部</title>
<style>
:root{
  --bg:#071421;--pn:#0c1e2e;--pn2:#12293c;--ln:#24445c;--tx:#dbe8f0;--mut:#86a0b3;
  --bl:#5fb0ff;--rd:#ff6b5e;--am:#f2b54a;--gr:#63dba0;--cy:#7fd6e2;
  --go:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mi:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS PMincho",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.6 var(--go);overscroll-behavior:none;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.r{color:var(--rd)}.g{color:var(--gr)}.am{color:var(--am)}.b{color:var(--bl)}.mut{color:var(--mut)}.sm{font-size:12.5px}
h1,h2,h3{font-family:var(--mi);font-weight:600;margin:0}

/* ---------- 司令部 ---------- */
#hq{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 14px 0;padding-top:max(12px,env(safe-area-inset-top))}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ttl h1{font-size:21px;letter-spacing:.32em}
.ttl span{font-size:12.5px;color:var(--cy)}
.gz{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px;margin-top:10px}
.gz label{display:block;font-size:11px;color:var(--mut)}
.gz span{font-size:16px}
.bar{display:block;height:4px;background:#16303f;margin-top:3px}
.bar>b{display:block;height:100%;background:var(--cy);max-width:100%}
.bar>b.g{background:var(--gr)}.bar>b.am{background:var(--am)}.bar>b.r{background:var(--rd)}.bar>b.b{background:var(--bl)}
.tabs{display:flex;gap:2px;margin:10px -14px 0;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);font-size:14px;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--cy)}
#view{flex:1;padding:6px 14px 20px}
.sec{padding:16px 0 4px;border-bottom:1px solid #16303f}
.sec:last-child{border-bottom:0}
.sec>h2{font-size:16px;letter-spacing:.12em;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--cy)}
.sec p{margin:6px 0}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 14px max(14px,env(safe-area-inset-bottom))}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:9px 14px;line-height:1.3}
.btn:active{background:#1a3850}
.btn.pri{background:#1d4e6b;border-color:#3b88ad;color:#fff}
.btn.warn{border-color:var(--rd);color:#ffc2bb}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.4}
#next{width:100%;font-size:16px;padding:13px;letter-spacing:.15em}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;margin:0}
dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;text-align:right}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbox{background:var(--pn);border-top:2px solid var(--ln);padding:8px 9px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sbox b{font-size:13.5px}
.sbox small{color:var(--mut);line-height:1.4}
.sbox.occ{border-top-color:var(--rd);background:#2a1616}
.al{padding:6px 10px;border-left:3px solid var(--ln);background:var(--pn);font-size:13.5px;color:var(--tx)}
.al.am{border-left-color:var(--am)}.al.r{border-left-color:var(--rd)}
.lg{font-size:13px;display:flex;gap:10px}
.lg span{color:var(--mut);flex:0 0 auto;font-size:12px}
.unit{background:var(--pn);border-left:3px solid var(--bl);padding:10px 12px;margin:10px 0}
.unit.away{border-left-color:var(--am)}
.uh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uh b{font-size:16px;font-family:var(--mi);letter-spacing:.08em}
.uh small{color:var(--mut)}
.uh .loc{margin-left:auto;font-size:12.5px;color:var(--cy)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);padding:0 5px;color:var(--cy);line-height:1.5}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 6px}
.st3 label{font-size:12px;color:var(--mut)}
.amm{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0}
.urow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.urow>label{flex:0 0 52px;color:var(--mut);font-size:12px}
.urow select{flex:1;min-width:0;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:6px}
.seg{display:flex;flex:1;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:none;border:0;border-left:1px solid var(--ln);padding:7px 2px;font-size:12.5px;line-height:1.25}
.seg button:first-child{border-left:0}
.seg button.on{background:#1d4e6b;color:#fff}
.seg button:disabled{opacity:.3}
.seg button small{display:block;font-size:11px;color:var(--mut)}
.seg button.on small{color:#cfe6f2}
.mini{width:30px;height:28px;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:0}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #16303f;font-size:13.5px}
.drow>div:first-child{flex:0 0 38%;min-width:0}
.item{padding:10px 0;border-top:1px solid #16303f}
.item p{margin:3px 0 8px}
h3.sub{font-size:14px;margin:16px 0 2px;color:var(--cy);letter-spacing:.1em}
.off{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #16303f;flex-wrap:wrap}
.off .os{display:flex;gap:10px;font-size:12px;color:var(--mut)}
.off .os b{color:var(--tx);margin-left:3px;font-size:14px}
.cur{background:var(--pn);padding:10px 12px;display:grid;gap:4px}
.smap{width:100%;height:auto;display:block;margin-bottom:8px}
.smap text{font-family:var(--go)}
.smap .t1{fill:#dbe8f0;font-size:11px}.smap .t2{fill:#86a0b3;font-size:9.5px}

/* ---------- モーダル ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(3,10,17,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--cy);max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px 18px 16px}
.mbox h2{font-size:19px;letter-spacing:.1em;margin:4px 0 10px}
.mbox p{margin:8px 0}
.mbox ul{margin:6px 0;padding-left:1.2em}.mbox li{margin:4px 0}
.alert{font-size:12.5px;letter-spacing:.2em;color:var(--am)}
.alert.r{color:var(--rd)}.alert.g{color:var(--gr)}
dl.kv2{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13.5px}
dl.kv2 dt{color:var(--mut);white-space:nowrap}dl.kv2 dd{margin:0}
.mbtn{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pol{margin-top:10px;padding:8px 10px;background:var(--pn2);font-size:14px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#16384d;border:1px solid var(--cy);padding:8px 14px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}

/* ---------- 戦闘 ---------- */
#bt{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#040d16}
.btop{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.bclk{font-size:13px;color:var(--cy)}
.roe{font-size:11.5px;padding:2px 8px;border:1px solid;white-space:nowrap}
.roe.hold{color:var(--bl)}.roe.auth{color:var(--am)}.roe.hot{color:var(--rd);background:#34110f}.roe.wd{color:var(--gr)}
.spd{display:flex;margin-left:auto;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.spd button{background:none;border:0;border-left:1px solid var(--ln);padding:6px 0;font-size:12px;width:32px}
.spd button:first-child{border-left:0}
.spd button.on{background:var(--cy);color:#06222a}
.bmap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ban{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 16px;border:1px solid var(--cy);background:rgba(6,19,32,.92);font-family:var(--mi);font-size:14px;letter-spacing:.14em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.ban.show{opacity:1}
.ban.r{border-color:var(--rd);color:var(--rd)}.ban.am{border-color:var(--am);color:var(--am)}.ban.g{border-color:var(--gr);color:var(--gr)}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:3px;border:1px solid var(--ln);background:rgba(7,20,33,.85);font-size:17px}
.bobj{position:absolute;left:8px;bottom:8px;font-size:11.5px;color:var(--tx);background:rgba(6,19,32,.85);padding:4px 8px;max-width:calc(100% - 64px);border-left:2px solid var(--cy)}
.bpan{background:var(--bg);border-top:1px solid var(--ln);padding:7px 8px}
#bstat{font-size:12.5px;min-height:38px;line-height:1.5}
#bact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:38px}
#bact button{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:8px 10px;font-size:13px;line-height:1.2}
#bact button.atk{border-color:var(--rd);color:#ffc2bb}
#bact button.am{border-color:var(--am);color:#ffe0a6}
#bact button.g{border-color:var(--gr);color:#c6f5dd}
#bact button:disabled{opacity:.35}
.blog{height:70px;overflow:auto;background:#050f19;border-top:1px solid var(--ln);padding:4px 8px max(4px,env(safe-area-inset-bottom));font-size:12px;line-height:1.55}
.blog span{color:var(--mut);margin-right:8px}
@media (min-width:900px){.blog{height:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sub{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:0 0 auto;background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:6px 12px;font-size:13px;color:var(--mut)}
.sub button.on{background:#1d4e6b;color:#fff;border-color:#3b88ad}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:5px 9px;font-size:12.5px;color:var(--mut)}
.chips button.on{background:#1d4e6b;color:#fff;border-color:#3b88ad}
.chips small{margin-left:5px;color:var(--cy)}
.chips button.on small{color:#cfe6f2}
.pips{display:flex;gap:3px;margin:5px 0}.pips i{flex:1;height:5px;background:#16303f}.pips i.on{background:var(--cy)}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #16303f;cursor:pointer;line-height:1.45}
.orow.dis{opacity:.4;cursor:default}
.orow .os{display:flex;gap:7px;font-size:11px;color:var(--mut);flex:0 0 auto}
.orow .os b{color:var(--tx);margin-left:2px;font-size:13.5px}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.flt select,.urow select,.srow input{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:6px;color:var(--tx);min-width:0}
.chk{font-size:13px;display:flex;align-items:center;gap:5px}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px;font-size:13px}
.rkb>div{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.rkb b{text-align:right}
.erow{display:grid;grid-template-columns:1.25fr 1.3fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #16303f;font-size:13px;line-height:1.4}
.erow .sk{font-size:11px;color:var(--mut)}.erow .sk b{color:var(--tx);font-size:14px;margin-left:4px}
.abl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:8px 0}
.abl label{font-size:12px;color:var(--mut)}
.grow{flex:1;min-width:0}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th,.tb td{text-align:right;padding:4px 2px;border-top:1px solid #16303f}
.tb th{color:var(--mut);font-weight:400}.tb td:first-child,.tb th:first-child{text-align:left}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px}
.srow.col{flex-direction:column;align-items:stretch;gap:4px}
.srow>label{color:var(--mut);font-size:12.5px}
.srow input{flex:0 1 190px}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:32px;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:0}
.stp span{min-width:92px;text-align:center}
.mbox h2.big{font-size:30px;letter-spacing:.3em;margin:10px 0 14px}
.mbox .mbtn .btn.sm{text-align:left}
.zoom button{font-size:14px}
.zoom button.on{background:var(--cy);color:#06222a}
.orow.w{flex-direction:column;align-items:stretch;gap:3px}
.orow .o2{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* 作戦図・艦隊・陸上部隊・地上戦 */
.tmap{width:100%;height:auto;display:block;margin-bottom:8px;touch-action:manipulation;border:1px solid var(--ln)}
.tmap text{font-family:var(--go);pointer-events:none}
.tmap .t1{fill:#dbe8f0;font-size:10.5px}.tmap .t2{fill:#86a0b3;font-size:9px}
.tmap g{cursor:pointer}
.zb{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.zb button{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:7px 1px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden}
.zb button.on{background:#1d4e6b;color:#fff;border-color:#3b88ad}
.zb button.dst{border-color:var(--am);color:#ffe0a6}
.fb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#1d4e6b;border:1px solid var(--bl);font-size:12px;color:#fff;flex:0 0 auto;align-self:center}
.facs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0}
.facs div{background:var(--pn);padding:6px 8px;font-size:12.5px;border-left:2px solid var(--ln)}
.facs div.dm{border-left-color:var(--rd)}
.facs small{display:block;color:var(--mut);font-size:11.5px;line-height:1.4}
.sbox{cursor:pointer}
.zp{border-top:2px solid var(--cy)}
#gb{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#040d16}
#gcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.gsp{flex:1}
#gstat{font-size:12.5px;min-height:38px;line-height:1.5}
#gact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:38px}
#gact button{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:8px 10px;font-size:13px;line-height:1.2}
#gact button.am{border-color:var(--am);color:#ffe0a6}
#gact button.g{border-color:var(--gr);color:#c6f5dd}
#gact button:disabled{opacity:.35}

/* 国を選ぶ画面 */
.flag{display:inline-block;width:18px;height:12px;border:1px solid rgba(255,255,255,.35);vertical-align:-1px;margin-right:5px;flex:0 0 auto}
.flag.big{width:36px;height:24px;margin-right:8px;align-self:center}
.nlist{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin:8px 0 12px}
.nlist button{display:flex;align-items:center;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:8px 8px;font-size:13px;color:var(--tx);text-align:left;white-space:nowrap;overflow:hidden}
.nlist button.on{background:#1d4e6b;border-color:#3b88ad;color:#fff}
.ncard{background:var(--pn);border-top:2px solid var(--cy);padding:10px 12px;margin-bottom:10px}
.ncard .srow select{flex:1;min-width:0;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:6px;color:var(--tx)}

/* 世界地図と装備の諸元 */
canvascanvas.nnav{position:sticky;top:-18px;background:var(--pn2,#0f2233);padding:8px 0;margin:-8px 0 8px;z-index:2;border-bottom:1px solid var(--ln)}
.eqc{background:var(--pn);border-left:2px solid var(--cy);padding:8px 10px;margin:8px 0}
.eqc .kv{margin:4px 0 0}

/* 編集画面 */
.edin{width:112px;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:7px 8px;color:var(--tx);font-size:14px;text-align:right;flex:0 0 auto}
.edin.wide{width:auto;flex:1;min-width:0;text-align:left}
.eqc .srow select,.sec>.srow select{flex:1;min-width:0;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:7px;color:var(--tx)}
.mvw{position:relative;margin:8px 0 10px}
.mvw canvas{display:block;width:100%;border:1px solid var(--ln);background:#06141f;touch-action:none;user-select:none;-webkit-user-select:none}
.mvb{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:5px}
.mvb button{width:34px;height:34px;padding:0;border:1px solid var(--ln);border-radius:3px;background:rgba(7,20,33,.86);color:#dfe9f0;font-size:17px;line-height:1}
svg.sil{vertical-align:middle;margin-right:5px}
.gen{display:inline-block;border:1px solid;border-radius:3px;padding:0 5px;font-size:11px;line-height:17px;margin-left:6px;white-space:nowrap;font-weight:normal}
.eqn{border-top:1px dashed var(--ln);margin-top:8px;padding-top:8px}
.lin{margin-top:8px}.lin summary{font-size:13px;color:var(--cy);cursor:pointer;padding:6px 0}.lin .sm{padding:2px 0}.lin .gen{margin:0 6px 0 0}
.eqt{margin:8px 0;padding:8px 10px;border:1px solid var(--ln)}.eqt>b{display:block;margin-bottom:4px}.eqt .gen{margin-left:4px}
.org,.org ul{list-style:none;margin:0;padding:0}
.org ul{margin-left:13px;border-left:1px solid #2b5066;padding-left:11px}
.org li{position:relative;margin:7px 0}
.org ul>li:before{content:'';position:absolute;left:-11px;top:17px;width:10px;border-top:1px solid #2b5066}
.org ul>li:last-child:after{content:'';position:absolute;left:-12px;top:18px;bottom:-8px;width:2px;background:var(--bg,#081520)}
.ob{display:inline-flex;flex-direction:column;min-width:98px;max-width:150px;border:1px solid #3b6a85;background:#0c2233;padding:5px 8px;border-radius:3px;cursor:pointer;line-height:1.35;vertical-align:top}
.ob small{color:var(--cy);font-size:11px}.ob b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ob span{font-size:11px;color:var(--mut)}
.ob.vac{border:1px dashed #ff6b5e;background:#2a1414}.ob.vac b{color:#ff8f84}.ob.low{border-color:#f2b54a}
.ob.me{border-color:#9fd0ff;background:#123a55;cursor:default}.ob.wide{min-width:150px}
.obg{display:flex;flex-wrap:wrap;gap:5px}
.oh{display:inline-flex;align-items:center;gap:8px;background:#16384d;border:1px solid #3b6a85;border-radius:3px;padding:5px 10px;font-weight:bold;font-size:14px}
.oh small{font-weight:normal;color:var(--mut);font-size:11.5px}
.vb{font-style:normal;font-weight:normal;font-size:11px;color:#ff8f84;border:1px solid #ff6b5e;border-radius:3px;padding:0 5px}

function allPosts(){const a=[];
  for(const p of PHQ)a.push({id:'hq:'+p[0],n:p[1],rk:p[2],ab:p[3],g:'hq',d:p[4],sp:p[0]==='av'?1:p[0]==='n2'?5:p[0]==='n4'||p[0]==='n8'?4:null});
  for(const l of S.labs)a.push({id:'lab:'+l.id,n:LABT[l.t].n+' 所長',rk:[4,6],ab:'tec',g:'org',d:'研究の速さ',sp:6});

  for(const u of S.units){const sub=PT[u.type].cat==='sub';for(const p of shipPosts(u))a.push({id:u.id+':'+p[0],n:(sub&&SUBL[p[0]])||p[1],rk:p[2],ab:p[3],g:'u'+u.id,u,k:p[0],sp:sub?2:p[4]});}

function pickW(a){return a[Math.floor(Math.random()*a.length)];}
function genOff(rank){const sp=pickW([0,0,0,0,1,1,2,3,3,4,5,6]),b=4+rank*1.1;
  const o={id:++S.oid,name:mkName(),rank,age:23+rank*5+RI(0,4)+(rank>4?RI(0,3):0),sp,pot:RI(11,20),merit:RI(0,20)+rank*4,tig:RI(0,3),sat:RI(55,85),post:null,sch:null,tr:[],bt:0};
  for(const k of ABK)o[k]=clamp(Math.round(b+R(-2.5,3.5)),2,19);

  if(Math.random()<.45)o.tr.push(pick(TRAIT)[0]);if(Math.random()<.1){const t=pick(TRAIT)[0];if(!o.tr.includes(t))o.tr.push(t);}

function postScore(o,p){if(o.sch)return -1;const lo=p.rk[0],hi=p.rk[1];if(o.rank>hi||o.rank<lo-1)return -1;return effAb(o,p.ab)*2+(o.rank<lo?-6:0)+(p.sp!=null&&o.sp===p.sp?3:0)+o.cmd*.3+o.merit*.01;}
function cleanPosts(){_PM=null;const ps={};for(const p of allPosts())ps[p.id]=p;const seen={};
  for(const o of S.off){if(!o.post)continue;const p=ps[o.post];if(!p||o.rank>p.rk[1]||o.sch||seen[o.post]){o.post=null;continue;}seen[o.post]=1;}_PM=null;}
function autoAssign(){_PM=null;const pm=postMap(),posts=allPosts().filter(p=>!pm[p.id]);if(!posts.length)return 0;
  const pri=p=>p.id==='hq:cs'?100:p.k==='co'?90+PT[p.u.type].val/100:p.g==='hq'?70:p.k==='we'||p.k==='op'?60:p.g==='org'?50:40;
  posts.sort((a,b)=>pri(b)-pri(a));let n=0;const free=S.off.filter(o=>!o.post&&!o.sch);
  for(const p of posts){let best=null,bs=0;for(const o of free){if(o.post)continue;const s=postScore(o,p);if(s>bs){bs=s;best=o;}}if(best){best.post=p.id;n++;}}
  _PM=null;_M=null;return n;}
function crewK(){let v=0;for(const l of LINE)if(l[3]==='crewReq')v+=l[4]*lvOf(l[0]);return 1-clamp(v,0,.4);}

function mods(){if(_M)return _M;const M={};for(const k in STAT)M[k]=0;
  for(const l of LINE){const v=lvOf(l[0]);if(v)M[l[3]]+=l[4]*v;}
  for(const p of PROJ)if(p.fx&&S.flags[p.k])for(const k in p.fx)M[k]+=p.fx[k];
  for(const s of EQSK){const fx=eqFx(s,eqCur(s).i);for(const k in fx)M[k]+=fx[k];}
  {const px=polSum();for(const k in px)if(k in M)M[k]+=px[k];}
  const nn=NATS[S.cfg.nat]||NATS[0];for(const k in nn.fx)M[k]+=nn.fx[k];for(const k in CUR.efx)M[k]+=CUR.efx[k];if(S.ed)for(const k in S.ed.fx)if(k in M)M[k]+=S.ed.fx[k];
  BITEM.forEach((b,i)=>{M[b[4]]+=b[5]*(S.bud[i]-2);});
  const pm=postMap(),has=(id,t)=>!!pm[id]&&pm[id].tr.includes(t),ab=(id,k)=>pm[id]?effAb(pm[id],k)-10:-4,cs=clamp(1+ab('hq:cs','adm')*.03,.8,1.4),st=(id,k)=>ab(id,k)*cs;
  M.reinT+=st('hq:n3','cmd')*1.5;M.q+=st('hq:n3','cmd')*.003;M.intel+=st('hq:n2','tec')*.02;M.satT+=st('hq:n2','tec');
  M.upk+=st('hq:n4','adm')*.004+(has('hq:n4','thrift')?.02:0);M.cec+=st('hq:n6','tec')*.01;M.radM+=st('hq:n6','tec')*.005;M.trGain+=st('hq:n7','cmd')*.03;
  M.attr+=st('hq:n1','adm')*.01;M.offGrow+=st('hq:n1','adm')*.02;M.budg+=st('hq:n5','adm')*.01+(has('hq:n5','pol')?.08:0)+(has('hq:cs','pol')?.08:0);M.projRisk+=st('hq:n5','adm')*.008;
  M.cost+=st('hq:n8','adm')*.004+(has('hq:n8','thrift')?.02:0);M.support+=st('hq:pa','cool')*.03;M.prePen+=st('hq:ja','cool')*.02;
  M.warn+=st('hq:ja','cool')*.006+(has('hq:ja','intl')?.03:0)+(has('hq:pa','intl')?.02:0);M.tension+=has('hq:ja','intl')?.05:0;
  M.ftrAam+=st('hq:av','atk')*.004+(has('hq:av','ace')?.03:0);M.deck+=st('hq:av','atk')*.01+(has('hq:av','ace')?.1:0);
  M.dockSpd+=ab('base:0','adm')*.01;M.offGrow+=ab('sch:0','adm')*.03;M.enlTr+=ab('sch:1','tec')*.02;M.recSk+=ab('sch:2','cmd')*.3;
  let men=0;for(const id in pm){const o=pm[id];if(o.rank>=5&&o.tr.includes('mentor'))men++;if(id.startsWith('hq:')&&o.tr.includes('char'))M.morale+=.1;}M.offGrow+=Math.min(.3,men*.05);
  const rq=reqRates();for(const r of RATE){const e=S.enl[r[0]],need=rq[r[0]];if(!need||!e)continue;M[r[2]]+=r[3]*((clamp(e.n/need,.5,1)-1)*2+(e.sk-60)/100*.5);}
  return _M=M;}
function unitQ(u){const M=mods(),rd=u.rd<30?.8:u.rd<50?.9:1;if(!PT[u.type].crew)return clamp((.85+M.usv*.5)*rd,.3,1.15);
  return clamp((0.6+0.4*u.tr/100)*rd*(.9+.1*S.pers.morale/100)*(.7+.3*clamp(fill(),.5,1))+M.q,.3,1.15);}
const ftrCap=u=>PT[u.type].fcap+(u.mods.includes('k_deck')?4:0),aewCap=u=>PT[u.type].acap;
function cap(u){const t=PT[u.type],M=mods();return{sam:Math.round((t.sam||0)*(1+M.samCap)*(u.mods.includes('k_vls')?1.4:1)),asm:Math.round((t.asm||0)*(1+M.asmCap)),torp:t.torp||0,aam:t.aam||0,aasm:t.aasm||0};}
function scaleK(sc){return sc==='p'?reqPers()/2300:sc==='u'?Math.max(.4,S.units.reduce((a,u)=>a+PT[u.type].up,0)/110):sc==='a'?Math.max(.3,airCount()/9):1;}
function itemCost(i,L){const b=BITEM[i];return b[2]*COSTK*LVM[L==null?S.bud[i]:L]*scaleK(b[3])*(1-clamp(mods().cost,-.2,.3));}
const labCost=l=>8*l.lv*LVM[l.fund];
function labRP(l){const o=postMap()['lab:'+l.id],dir=o?(o.tec-10)*.03+(o.tr.includes('tech')?.1:0):-.1;return LABRP[l.lv]*LVM[l.fund]*(LABT[l.t].eff||1)*(1+dir)*(1+mods().rp);}
function catCost(c){let s=0;BITEM.forEach((b,i)=>{if(b[1]===c)s+=itemCost(i);});if(c===4)for(const l of S.labs)s+=labCost(l);return s;}
const debtPay=()=>S.debts.reduce((a,d)=>a+d.per,0);
function monthCost(){let s=upkeep()+debtPay();for(let c=0;c<BCAT.length;c++)s+=catCost(c);return s;}
const income=()=>Math.round(S.budget/12);
function fleetPower(us){return (us||S.units).filter(u=>u.mode==='normal'||u.mode==='drill').reduce((a,u)=>a+PT[u.type].val*unitQ(u)*(u.hp/100)+(u.ftr||0)*8+(u.aew||0)*12,0)*(1+totalLv()/500);}
function enemyPower(){return Math.round((420+Math.min(S.month,120)*10+Math.max(0,S.month-120)*4)*(.5+.5*S.cfg.eGrow)*(S.w?S.w.rivK:1));}
const eTech=()=>S.month/60*S.cfg.eGrow+((S.cfg.era||4)-4)*1.5;
const reinTime=()=>Math.round(clamp(S.cfg.reinT-mods().reinT,30,180));
function thr(i){const s=S.sectors[i],v=s.est==null?s.threat:s.est;return v<30?{t:'低',c:'g',v}:v<55?{t:'中',c:'am',v}:v<75?{t:'高',c:'r',v}:{t:'極めて高',c:'r',v};}
function price(k){const M=mods(),t=PT[k],s=SHOPX[k];return Math.round(t?t.cost*(1-clamp(M.buildC,-.3,.4)):s.cost*(s.kind==='ammo'?1-clamp(M.ammoC,-.2,.5):1));}
function buildMo(k){const t=PT[k],s=SHOPX[k];return Math.max(1,Math.round((t?t.build:s.build)*(t?1-clamp(mods().buildT,-.3,.45):1)));}

/* ================= 月の進行 ================= */
function reload(){const order=[...S.units].sort((a,b)=>a.sector-b.sector);let short=false;
  for(const u of order){const c=cap(u);for(const k in c){const need=c[k]-(u.load[k]||0);if(need>0){const give=Math.min(need,S.cfg.sandbox?need:S.stock[STK[k]]);u.load[k]=(u.load[k]||0)+give;if(!S.cfg.sandbox)S.stock[STK[k]]-=give;if(give<need)short=true;}else if(need<0)u.load[k]=c[k];}}
  return short;}
function distribute(n,due){if(n<=0)return;const rq=reqRates(),P=S.pers,pend={};for(const p of P.pipe)pend[p.r]=(pend[p.r]||0)+p.n;
  let w=RATE.map(r=>Math.max(0,(rq[r[0]]||0)-S.enl[r[0]].n-(pend[r[0]]||0))),sum=w.reduce((a,b)=>a+b,0);
  if(sum<=0){w=RATE.map(r=>rq[r[0]]||0);sum=w.reduce((a,b)=>a+b,0)||1;}
  if(P.pol!=='auto'){const i=RATE.findIndex(r=>r[0]===P.pol);if(i>=0){w=w.map(x=>x*.5/sum);w[i]+=.5;sum=1;}}
  let left=n;RATE.forEach((r,i)=>{const k=Math.min(left,Math.round(n*w[i]/sum));if(k>0){P.pipe.push({n:k,r:r[0],due});left-=k;}});
  if(left>0)P.pipe.push({n:left,r:RATE[w.indexOf(Math.max(...w))][0],due});}
function monthlyPers(rep,M){const P=S.pers,dep=S.units.filter(u=>u.sector>0).length/Math.max(1,S.units.length),f0=fill();
  P.morale=clamp(P.morale+M.morale+(dep>.7?-1.2:dep<.4?.5:0)+(f0<.85?-1.5:0)+(60-P.morale)*.03,5,100);
  const ar=clamp((.0065+(55-P.morale)*.0002)*(1-clamp(M.attr,-.5,.7)),.0015,.03);
  for(const r of RATE){const e=S.enl[r[0]];e.n=Math.max(0,e.n-Math.round(e.n*ar*R(.6,1.4)));e.sk=clamp(e.sk+.25+M.enlTr+M.trGain*.2-(e.sk-55)*.012,20,98);}
  if(P.resv&&S.month>=P.resvEnd){const rq=reqRates(),tot=reqPers();for(const r of RATE){const e=S.enl[r[0]];e.n=Math.max(0,e.n-Math.round(P.resv*(rq[r[0]]||0)/Math.max(1,tot)));}P.resv=0;rep.push(['予備自衛官の招集を解除した','']);}
  distribute(Math.round(reqPers()*.0062*(1+clamp(M.recruit,-.8,1.5))*(.6+S.support/125)),S.month+3);
  P.pipe=P.pipe.filter(p=>{if(S.month<p.due)return true;const e=S.enl[p.r],sk=38+M.recSk*6;e.sk=(e.sk*e.n+sk*p.n)/Math.max(1,e.n+p.n);e.n+=p.n;return false;});
  if(f0>=.85&&fill()<.85)rep.push(['人員充足率が85%を割った','am']);
  const posts={};for(const p of allPosts())posts[p.id]=p;
  for(const o of S.off.slice()){
    if(o.sch){if(S.month>=o.sch.until){const c=COURSE.find(x=>x[0]===o.sch.k);for(const k in c[4])o[k]=clamp(o[k]+c[4][k],1,20);o.merit+=8;if(o.sch.k==='abr'&&!o.tr.includes('intl')&&Math.random()<.5)o.tr.push('intl');o.sch=null;rep.push([`${o.name}${RANK[o.rank]}：${c[1]}を修了`,'g']);}continue;}
    const p=o.post&&posts[o.post];
    if(p){o.sat=Math.min(100,o.sat+1);o.merit+=(.4+o.rank*.05)*(o.tr.includes('amb')?1.3:1);if(Math.random()<.05*(1+clamp(M.offGrow,-.5,2))&&o[p.ab]<o.pot)o[p.ab]++;}
    else if(o.rank>=3){o.sat-=2;if(o.sat<20&&Math.random()<.04){S.off=S.off.filter(x=>x!==o);if(o.rank>=4)rep.push([`${o.name}${RANK[o.rank]}が処遇への不満から退職した`,'am']);}}}
  _PM=null;}
function annualPers(){const P=S.pers,L=[],M=mods();let ret=0,pro=0;
  for(const o of S.off.slice()){o.age++;o.tig++;if(o.sch)continue;if(o.age>=RET[o.rank]||(o.tr.includes('frail')&&Math.random()<.15)){S.off=S.off.filter(x=>x!==o);ret++;if(o.rank>=5)L.push(`${o.name}${RANK[o.rank]}が退官`);}}
  const N=S.off.length;
  for(let r=6;r>=0;r--){const need=Math.max(r>=6?1:2,Math.round(N*RFRAC[r+1]))-S.off.filter(o=>o.rank===r+1).length;if(need<=0)continue;
    const c=S.off.filter(o=>o.rank===r&&o.tig>=TIG[r]&&!o.sch).sort((a,b)=>b.merit-a.merit);
    c.slice(0,need).forEach(o=>{o.rank++;o.tig=0;o.merit*=.4;o.sat=Math.min(100,o.sat+15);pro++;if(o.rank>=5)L.push(`${o.name}が${RANK[o.rank]}に昇任`);});
    c.slice(need).forEach(o=>{if(o.tr.includes('amb'))o.sat-=12;});}
  const inN=Math.max(2,Math.round(allPosts().length*.09*(1+clamp(M.cadet,-.6,1))));for(let i=0;i<inN;i++){const o=genOff(0);o.age=RI(22,25);o.merit=0;o.tig=0;}
  P.sp=0;cleanPosts();if(P.auto)autoAssign();P.rep=[`退官・退職 ${ret}名、昇任 ${pro}名、新任3尉 ${inN}名`].concat(L.slice(0,6));return P.rep;}
function autoPick(lab){const busy=S.labs.filter(l=>l!==lab&&l.cur).map(l=>l.cur),ds=lab.foc>=0?[lab.foc]:LABT[lab.t].d;let best=null,bc=1e9;
  for(const l of LINE){if(!ds.includes(l[2])||busy.includes(l[0]))continue;const lv=lvOf(l[0]);if(lv>=10)continue;const c=lineCost(l,lv+1)-((S.res[l[0]]||{}).prog||0)+Math.random();if(c<bc){bc=c;best=l[0];}}
  return best;}
function projOK(p){if(S.flags[p.k]||S.projs[p.k])return false;for(const k in p.req)if(lvOf(k)<p.req[k])return false;
  if(p.kind==='eq'){const c=eqCur(p.slot);if(c.i===p.idx||p.g<c.g||eqBusy(p.slot)||domLv(p.dreq[0])<p.dreq[1])return false;}return true;}
function monthlyRD(rep,M){const done=[];
  for(const lab of S.labs){if(lab.cur&&lvOf(lab.cur)>=10)lab.cur=null;if(!lab.cur&&lab.auto)lab.cur=autoPick(lab);if(!lab.cur)continue;
    const l=lineById[lab.cur],r=S.res[l[0]]||(S.res[l[0]]={lv:0,prog:0});r.prog+=labRP(lab);let g=0;
    while(r.lv<10&&r.prog>=lineCost(l,r.lv+1)&&g++<6){r.prog-=lineCost(l,r.lv+1);r.lv++;done.push(`${l[1]} ${r.lv}`);}
    if(r.lv>=10){r.prog=0;lab.cur=lab.auto?autoPick(lab):null;}else if(lab.auto&&g)lab.cur=autoPick(lab)||lab.cur;}
  if(done.length){_M=null;rep.push([`研究が進展：${done.slice(0,3).join('、')}${done.length>3?` ほか${done.length-3}件`:''}`,'g']);}
  for(const k of Object.keys(S.projs)){const pj=S.projs[k],p=PROJ.find(x=>x.k===k);
    if(pj.wait){if(canPay(p.c[pj.ph])){spend(p.c[pj.ph]);pj.wait=false;}else continue;}
    if(--pj.left>0)continue;
    if(!pj.rolled&&Math.random()<clamp(.22-M.projRisk,.03,.5)){pj.rolled=true;pj.left=RI(1,3);const ov=Math.round(p.c[pj.ph]*R(.1,.25));spend(ov);rep.push([`${p.n}：${PHASE[pj.ph]}の段階で不具合。${pj.left}か月の遅れ、追加費用${ov}億円`,'am']);continue;}
    pj.ph++;pj.rolled=false;
    if(pj.ph>=3){delete S.projs[k];S.flags[k]=1;if(p.kind==='unit')S.unlock[k]=1;if(p.kind==='kit')S.kits[k]=1;if(p.kind==='eq')S.eqm[p.slot]=p.idx;_M=null;rep.push([`開発完了：${p.n}${p.kind==='unit'?'(調達できる)':p.kind==='kit'?'(各艦に改修できる)':p.kind==='eq'?`(${EQS[p.slot][1]}を更新。全軍に配備)`:'(全軍に配備)'}`,'g']);}

function fiscal(){const C=S.cfg,old=S.budget;S.fy++;

function genForce(type,L,eT){const r=x=>Math.max(0,Math.round(x));let f;

  else if(type==='airraid')f={ebmr:Math.max(1,r(.6+L*.8)),eftr:r(L*.6-.3),eff:1,eddg:r(L*.4-.3)};
  else if(type==='landing')f={elst:L>2.6?2:1,eddg:Math.max(1,r(L*.5)),eff:Math.max(1,r(L*.7)),ess:r(L*.4),ebmr:r(L*.6),eftr:r(L*.6),ecv:L>3?1:0};
  else f={eddg:Math.max(1,r(L*.5)),eff:Math.max(1,r(L*.8)),ess:1,eftr:r(L*.5)};

function mkIncident(i,type){const C=S.cfg,T=clamp(S.tension*C.eAggr,0,100),L=1+Math.min(2.5,S.month/30*C.eGrow)+S.tension/100+((S.w?S.w.rivK:1)-1)*1.5,eT=eTech();

    h=`<div class="alert r">陥落</div><h2>${ISL[z]}が占領された</h2><p>守備隊は壊滅し、島は敵の手に落ちた。</p>`;}
  polApply(dS,dT);S.pers.morale=clamp(S.pers.morale+(win?3:-4),5,100);checkOver();save();render();
  modal(h+`<div class="pol">支持率 ${sg(dS)}　緊張度 ${sg(dT)}</div><div class="mbtn"><button class="btn pri" data-m="ok">確認</button></div>`,{ok:()=>{closeModal();if(S.over)showOver();}});}

function alerts(){const a=[],pm=postMap();
  for(const e of S.efl)if(e.known)a.push([`敵の揚陸部隊が${ISL[e.z]}を狙っている。到達まであと${e.eta}か月`,'r']);
  if(S.fore&&S.foreK)a.push([`情報：来月、${SECT[S.fore.sector]}で${SCN[S.fore.type].n}の兆候がある`,'am']);
  for(const i of ISLZ){const s=S.sectors[i],here=fightIn(i).length;
    if(!s.held){a.push([`${ISL[i]}が占領下にある。「作戦」の作戦図から奪還に動ける`,'r']);continue;}
    if(!here&&!reserve(i).all.length)a.push([`${SECT[i]}：艦隊がおらず、駆けつけられる増援もない`,'r']);else if(thr(i).v>=55&&!here)a.push([`${SECT[i]}：敵の活動が活発だが、所在の艦隊がない`,'am']);
    if(!garrison(i).length)a.push([`${ISL[i]}に守備隊がいない。上陸されれば無抵抗で占領される`,'am']);}
  const ln=ZONES.map((Z,i)=>Z.lane&&thr(i).v>=60&&!inZone(i).length?Z.n:null).filter(Boolean);if(ln.length)a.push([`シーレーンが脅かされている：${ln.join('、')}`,'am']);
  const low=S.units.filter(u=>u.rd<40&&u.mode!=='dock');if(low.length)a.push([`整備度が低い：${low.map(u=>u.name).join('、')}`,'am']);
  const dm=S.units.filter(u=>u.hp<70&&u.mode!=='dock');if(dm.length)a.push([`損傷艦：${dm.map(u=>u.name).join('、')}(ドック整備で修理)`,'r']);
  if(S.units.some(u=>{const c=cap(u);return Object.keys(c).some(k=>(u.load[k]||0)<c[k]);}))a.push(['弾薬が定数に足りない艦がある。「調達」で補充を','am']);
  if(fill()<.9)a.push([`曹士の充足率 ${Math.round(fill()*100)}%`,'am']);
  const vac=allPosts().filter(p=>!pm[p.id]).length;if(vac)a.push([`欠員のポストが ${vac} ある(人事の「補職」)`,'am']);
  if(S.labs.some(l=>!l.cur&&!l.auto))a.push(['課題が決まっていない研究所がある','am']);
  if(Object.keys(S.projs).some(k=>S.projs[k].wait))a.push(['資金不足で止まっている開発計画がある','am']);
  if(S.funds<0)a.push(['資金が赤字。続くと支持率が下がる','r']);
  return a;}
function thrCol(i){const s=S.sectors[i],lv=thr(i);return !s.held||lv.c==='r'?'#ff6b5e':lv.c==='am'?'#f2b54a':'#63dba0';}
const gLoc=g=>g.loc==='home'?'本土':g.loc[0]==='i'?ISL[+g.loc.slice(1)]:(FL(+g.loc.slice(1))||{n:'艦隊'}).n+'に乗船';
function gRow(g,act){const t=GT[g.type];return `<div class="unit ${g.loc==='home'?'':'away'}"><div class="uh"><span class="tag">${t.s}</span><b>${g.name}</b><span class="loc">${esc(gLoc(g))}</span></div>

function zonePanel(z){const Z=ZONES[z],s=S.sectors[z],il=S.isl[z],here=inZone(z),fl=S.fleets.filter(f=>f.zone===z);

    return h+`<p class="sm">${RIV.f}の泊地。艦隊を踏み込ませることはできない。侵攻部隊はここに集結してから島へ向かう。</p>${es.map(e=>`<p class="al r">揚陸部隊が${e.eta>=2?'集結している':'出撃した'}。目標は${ISL[e.z]}、到達まであと${e.eta}か月</p>`).join('')||'<p class="sm mut">目立った動きは確認されていない。</p>'}</section>`;}
  const rs=reserve(z);h+='<dl class="kv2">';

  else if(Z.lane)h+=`<dt>航路の脅威</dt><dd class="${thr(z).c}">${thr(z).t}${thr(z).v>=60&&!here.length?'。通商妨害で毎月の収入と支持が削られている':''}</dd>`;
  else h+=`<dt>${s.held?'敵の活動':'状況'}</dt><dd class="${s.held?thr(z).c:'r'}">${s.held?thr(z).t:Z.isl+'は占領下'}</dd>`;
  h+=`<dt>所在の艦隊</dt><dd>${fl.length?fl.map(f=>esc(f.n)).join('、'):'なし'}${here.length?`<br><span class="mut sm">${here.length}隻、戦力 ${Math.round(fleetPower(here))}</span>`:''}</dd>`;
  if(!Z.home)h+=`<dt>増援に来られる艦</dt><dd>隣の海域 ${rs.near.length}隻、2つ先 ${rs.far.length}隻</dd>`;
  h+='</dl>';
  if(il&&s.held){const gar=garrison(z);
    h+=`<h3 class="sub">施設</h3><div class="facs">${Object.keys(FAC).map(k=>`<div class="${il.fac[k]<50?'dm':''}"><b>${FAC[k][0]}</b>${il.fac[k]<50?' <span class="r">損壊</span>':''}<small>${FACD[k]}</small></div>`).join('')}</div>
    <h3 class="sub">守備隊 ${gar.length}個</h3>${gar.length?gar.map(g=>gRow(g)).join(''):'<p class="al am">守備隊がいない。上陸されれば無抵抗で占領される。「部隊」の陸上部隊を輸送艦に乗せて運ぶこと。</p>'}`;}
  else if(il){const ctrl=seaCtrl(z),emb=landForce(z),str=e=>e.hp>=8?'充足':e.hp>=5?'消耗':'壊滅寸前';
    h+=`<h3 class="sub">敵の守備隊(推定)</h3><p class="sm">${il.egar.map(e=>`${GT[e.t].n}<span class="mut">(${str(e)})</span>`).join('、')}</p>
    <dl class="kv2"><dt>陣地</dt><dd>${FORT[il.fort]}</dd><dt>周辺の敵艦隊</dt><dd class="${il.cover?'r':'g'}">${il.cover?'居座っている':'排除済み'}</dd><dt>制海</dt><dd>${ctrl?'<span class="g">確保</span>。敵守備隊の補給を断っている':il.cover?'未確保':'未確保。この海域に戦闘艦を置くこと'}</dd><dt>上陸部隊</dt><dd>${emb.length?emb.map(g=>g.name+(g.loc==='home'?'(空挺降下)':'')).join('、'):'この海域の艦隊には乗っていない'}</dd></dl>
    <p class="sm mut">奪還の手順：①周辺の敵艦隊を排除して制海を得る　②艦砲射撃・空爆・ミサイルで守備隊と陣地を叩く(月に各1回)　③輸送艦に乗せた陸上部隊で上陸し、司令部を制圧する。制海を保つあいだは、封鎖で敵が毎月弱っていく。</p>
    <div class="brow"><button class="btn sm warn" ${il.cover?'':'disabled'} onclick="A.retake(${z})">①敵艦隊を排除</button><button class="btn sm" ${ctrl?'':'disabled'} onclick="A.prep(${z})">②準備攻撃</button><button class="btn sm pri" ${ctrl&&emb.length?'':'disabled'} onclick="A.land(${z})">③上陸作戦</button></div>`;}
  return h+'</section>';}
VIEW.home=()=>{const inc=income(),cost=Math.round(monthCost()),al=alerts(),C=S.cfg;

function showHelp(){const C=S.cfg;modal(`<div class="alert">着任</div><h2>${esc(C.fleetName)}司令部</h2><p>${C.cmdr?esc(C.cmdr)+'司令。':''}惑星${PLANET}。あなたは${esc(C.nation)}の${NAT.navy}で艦隊を預かる。対峙するのは${RIV.f}。任期の${C.years}年間、${[1,4,7].map(z=>SECT[z]+'の'+ISL[z]).join('、')}を守り抜く。支持率が0%になれば更迭される。</p>
<p class="sm">世界は${BLOC[1].n}(${S.w.n.filter(n=>n.bloc===1).length}か国)と${BLOC[2].n}(${S.w.n.filter(n=>n.bloc===2).length}か国)に割れている。${RIV.n}は${BLOC[2].s}の一員で、${NAT.n}はどちらにも属していない。どの国と組み、どこまで備えるかも、あなたが決める。</p>
<p class="sm mut">国柄「${NAT.tr[0]}」：${NAT.tr[1]}</p>
<ul class="sm"><li><b>作戦</b>：艦隊を海域へ送る。事案にはその海域の艦隊が当たり、隣と2つ先の海域からは増援が遅れて着く。シーレーンを空けたままにすると収入が減る</li><li><b>部隊</b>：艦の所属と演習・整備・改修、艦隊の編成、航空部隊の基地、陸上部隊の輸送と空輸。「編成表」で陸上部隊の中隊の組み合わせを決め、「基地」で港湾と飛行場を広げ、対空・対艦ミサイル基地を置く</li><li><b>航空部隊</b>：本土と島の飛行場に置く。国籍不明機には戦闘飛行隊が緊急発進し、受け持つ海域の海戦には基地から戦闘機を出せる</li><li><b>陸上部隊</b>：島の守備隊になる。敵に上陸されると地上戦になり、守備隊がいなければ無抵抗で占領される</li><li><b>本土の守り</b>：${lwNb().length?`${lwNb().map(natN).join('、')}と陸で接している。関係が悪く守りが薄いと、相手は国境を越えてくる。本土にいる陸上部隊と兵役の政策が抑えになる。開戦すると、敵は毎月プロヴィンスへ攻めかかり、こちらからも進攻できる。どの戦いも、自ら指揮するか任せるかを選べる。首都が落ちれば任期は終わる。「国政」の国防で国境の緊張と構えを見られる`:'この国は陸で他国と接していないので、本土が陸から攻め込まれることはない'}</li><li><b>奪還</b>：占領された島は、制海を得て、砲爆撃で叩き、上陸して司令部を制圧すれば取り戻せる</li><li><b>人事</b>：組織図の枠をタップして幹部を任命する</li><li><b>開発</b>：16分野の研究と、旧式から構想中までの装備の世代交代、新しい艦種の開発</li><li><b>予算</b>：64費目の配分と年度の折衝</li><li><b>国政</b>：世界情勢と外交、国防とドクトリン、国家方針、政策と顧問、州の開発、防衛産業の育成、資源の貿易と武器の輸出。政治力をためて使う</li><li><b>翌月へ進む</b>で時間が進む</li></ul>
<p><b>海戦の操作</b></p><ul class="sm"><li>自部隊をタップで選択、海面をタップで移動、敵をタップで目標に指定。右下の「3D」で立体表示。＋－と2本指で大きく拡大できる</li><li>領空侵犯には、航空基地をタップして戦闘機を上げ、相手の15km以内に寄せて「警告」する</li><li>敵が撃つか領海に居座るまで、武器は使えない。艦を相手の50km以内に寄せて「警告」し、退去させれば最良の結果になる。航空機からも、25km以内に寄せれば警告できる</li><li>哨戒航空隊が届く海域では、航空基地から哨戒機を上げられる。対艦ミサイルと短魚雷を積み、潜水艦も探せる。艦がいない海域の事案にも、哨戒機と攻撃飛行隊だけで出られる</li></ul>
<p><b>地上戦の操作</b></p><ul class="sm"><li>ターン制。自部隊をタップして、水色のマスへ移動、赤い枠の敵をタップで攻撃</li><li>動かず撃たなかった部隊は陣地を固める。森・丘・市街は守りやすい</li><li>艦砲射撃・爆撃・ミサイルは、その海域にいる艦隊が支援する。施設を制圧すると効果が自軍に移る</li></ul>

    else if(k==='morale')S.pers.morale=clamp(v,5,100);else if(k==='pftr')S.pool.ftr=clamp(Math.round(v),0,999);else if(k==='paew')S.pool.aew=clamp(Math.round(v),0,99);else if(k in S.stock)S.stock[k]=clamp(Math.round(v),0,99999);

  edall(w){let msg='';

    else if(w==='calm'){S.sectors.forEach((s,i)=>{if(s.held&&s.threat>0){s.threat=Math.max(5,s.threat-20);s.est=s.threat;}});msg='各海域の敵活動を下げた';}

  eda(k,i){if(!EQARC[k]||!EQARC[k][i])return;const E=edS();E.eqa=E.eqa||{};E.eqa[k]=i;edDone(`${EQL[k]}を${EQARC[k][i][0]}にした`);},
  edfx(k,v){if(!STAT[k]||!isFinite(v))return render();const E=edS(),sc=edSc(k),x=clamp(v/sc,sc===100?-.9:-999,sc===100?5:999);if(x)E.fx[k]=x;else delete E.fx[k];edDone();},
  edp(t,f,v){const d=EDPT.find(x=>x[0]===f);if(!d||!PT0[t]||PT0[t][f]==null||!isFinite(v))return render();const E=edS(),x=clamp(v,d[3],d[4])/d[2];(E.pt[t]=E.pt[t]||{})[f]=d[2]===1?Math.round(x):x;
    if(Math.abs(E.pt[t][f]-PT0[t][f])<1e-6){delete E.pt[t][f];if(!Object.keys(E.pt[t]).length)delete E.pt[t];}edDone();},

/* ================= 産業・貿易・ドクトリン ================= */
// 国内の防衛産業を育て、資源と武器の貿易を細かく決め、陸海空のドクトリンを選ぶ。
// S.corp[k]={lv,xp,inv}  S.cfoc=重点企業  S.doc[b]={k,m}  S.trade={res:{k:{buy,exp,to,stT}},stock:{k},log}  S.arms={pol,cat,list,offers,seq,askM}
/* ---------- 企業 ---------- */
// [キー, 業種, 社名の語尾, 段階ごとの効果, 説明]
const CORP=[
  ['yard','造船','造船',{buildC:.012,buildT:.012},'艦の調達価格と建造期間が下がる'],
  ['aero','航空機','航空機',{airPow:.012,airRdy:.008},'基地航空隊の戦力と稼働が上がる'],
  ['msl','誘導武器','精機',{ammoC:.025,samPk:.003},'弾薬が安くなり、ミサイルの命中が上がる'],
  ['elec','電子・センサー','電機',{radA:.01,rp:.01},'探知距離と研究点が伸びる'],
  ['land','車両・火砲','重工',{gndPow:.012},'陸上部隊の戦闘力が上がる'],
  ['mat','素材・エネルギー','製鋼',{upk:.006,gdpG:.04},'部隊の維持費が下がり、経済が伸びる']];
const CORPK=CORP.map(c=>c[0]),corpD=k=>CORP.find(c=>c[0]===k),corpNeed=lv=>60+40*lv,corpInvC=lv=>120+60*lv;
function corpName(k){const d=corpD(k),cs=myStates().map(stCity),i=CORPK.indexOf(k);return (i%2?NAT.n:cs[(i>>1)%cs.length]||NAT.n)+d[2];}
const corpSlots=lv=>Math.ceil(lv/3);
/* ---------- ドクトリン ---------- */
// 分野ごとに1つ選ぶ。選んだ直後は習熟が低く、効果は4割から始まって毎月伸びる
const DOC={
  sea:['海上',[['strike','艦隊打撃','水上艦の対艦ミサイルで敵艦隊を叩く',{asmDmg:.08,asmR:.06,asmPen:.03}],['deny','海域拒否','潜水艦で近づけさせない',{torpPk:.06,torpDmg:.08,sosus:.08}],['sloc','シーレーン防衛','対潜と護衛で航路を守る',{aswPk:.06,sonar:.08,threatSup:.3}],['cvn','空母機動','艦上機で制空と打撃を担う',{deck:.1,ftrLoad:.1,ftrFuel:.08}]]],
  air:['航空',[['sup','航空優勢','まず空を取る',{ftrAam:.05,ftrSurv:.05,scr:.06}],['mar','対艦航空攻撃','基地の航空機で艦隊と上陸部隊を叩く',{ftrAsmR:.1,strk:.1,airPow:.06}],['iad','統合防空','レーダーとミサイルで空を閉じる',{samPk:.04,radA:.08,gndAA:.15,scr:.04}]]],
  land:['陸上',[['pos','陣地防御','地形と陣地で本土を守り抜く',{hdK:.15,gndPow:.02}],['mob','機動打撃','装甲と火力で押し返し、攻め込む',{ofK:.2,gndPow:.05}],['amph','島嶼機動','水陸両用と空挺で島を守り、取り返す',{strk:.08,gndPow:.05}],['mil','国民皆兵','予備役と郷土防衛隊を厚くする',{grdK:.45,recruit:.1,hdK:.05}]]]};
Object.assign(POLXN,{hdK:['本土の防衛力',100,'%'],ofK:['進攻の戦力',100,'%'],grdK:['郷土防衛隊',100,'%']});
const docK=b=>.4+.6*clamp((S.doc[b].m||0)/100,0,1);
/* ---------- 貿易 ---------- */
const TBUY={oil:11,steel:8,rare:12,food:7},TSELL={oil:9,steel:6,rare:9,food:5},TDEST={any:['誰にでも',1],fr:['友好国だけ',.85],bloc:['自陣営だけ',.75]};
// 輸出先：その資源を産しない国のうち、方針に合う相手を関係のよい順に3か国まで
function tradeBuyers(k,to){const W=S.w,me=ME(),al=natAlive(),pb=W.n[me].bloc;return W.n.map((n,i)=>i).filter(i=>i!==me&&al[i]&&!W.n[i].sanc&&!(S.lw&&S.lw.e===i)&&!(natRes(i)[k])&&(to==='any'?W.n[i].rel>-60:to==='fr'?W.n[i].rel>=10:pb?W.n[i].bloc===pb:(W.n[i].def||W.n[i].trd))).sort((a,b)=>W.n[b].rel-W.n[a].rel).slice(0,3);}
/* ---------- 武器輸出 ---------- */
// [企業, 品目, 必要な段階]
const ARMS=[['yard','艦艇',4],['aero','航空機',5],['msl','ミサイル',4],['elec','レーダー・電子機器',3],['land','車両・火砲',3]];
const ARMPOL=[['禁輸','武器は輸出しない'],['同盟・友好国のみ','防衛協力か通商協定がある国、同じ陣営の国、関係が+20以上の国に限る'],['紛争当事国を除く','戦争をしている国には売らない'],['制限なし','相手を選ばない。対立陣営にも売れるが、相手を強くする']];
function armsOK(i,pol){const W=S.w,me=ME(),n=W.n[i],pb=W.n[me].bloc,rv=RVN();if(pol==null)pol=S.arms.pol;if(!pol||i===me||!natAlive()[i]||n.sanc||(S.lw&&S.lw.e===i)||n.rel<-55)return false;
  if(pol===1)return !!(n.def||n.trd||(pb&&n.bloc===pb)||n.rel>=20);if(pol===2)return !inWar(i)&&i!==rv;return true;}
function armsVal(k,i){const lv=S.corp[k].lv,eco=natEco()[i];return Math.round((6+lv*2.2)*clamp(eco/3000,.6,1.6)*(inWar(i)?1.5:1));}
function armsOffer(n){const A2=S.arms,al=natAlive(),W=S.w;let made=0;
  const cats=ARMS.filter(a=>A2.cat[a[0]]&&S.corp[a[0]].lv>=a[2]&&A2.list.filter(c=>c.cat===a[0]).length<corpSlots(S.corp[a[0]].lv));if(!cats.length)return 0;
  const ns=W.n.map((x,i)=>i).filter(i=>armsOK(i)&&!A2.list.some(c=>c.to===i)&&!A2.offers.some(o=>o.to===i)).sort((a,b)=>(inWar(b)?1:0)-(inWar(a)?1:0)+Math.random()-.5);
  for(const i of ns.slice(0,n)){if(A2.offers.length>=4)break;const a=pick(cats);A2.offers.push({id:++A2.seq,to:i,cat:a[0],months:RI(12,24),val:armsVal(a[0],i),exp:S.month+4});made++;}return made;}
/* ---------- 初期化 ---------- */
function econInit(){if(!S||!S.w)return;const r=rng32(977+ME()*13);
  if(!S.corp){S.corp={};const sp=CORPK[Math.floor(r()*CORPK.length)];for(const k of CORPK)S.corp[k]={lv:k===sp?4:3,xp:0,inv:null};S.cfoc=null;}
  if(!S.doc)S.doc={sea:{k:null,m:0},air:{k:null,m:0},land:{k:null,m:0}};
  if(!S.trade){S.trade={res:{},stock:{},log:{exp:0,buy:0,arms:0}};for(const x of RES){S.trade.res[x[0]]={buy:0,exp:1,to:'any',stT:0};S.trade.stock[x[0]]=0;}}
  if(!S.arms)S.arms={pol:1,cat:{yard:1,aero:1,msl:1,elec:1,land:1},list:[],offers:[],seq:0,askM:null};}
function extInit(){baseInit();armyInit();econInit();}
// 国政の効果の合計に足す(polSum から呼ばれる)
function econSum(add){if(!S.corp)return;for(const c of CORP)add(c[3],S.corp[c[0]].lv-1);

/* ---------- 月の処理 ---------- */

function econMonth(rep,rb){econInit();const T=S.trade,W=S.w,A2=S.arms;let inc=0;T.log={exp:0,buy:0,arms:0};
  for(const x of RES){const k=x[0],c=T.res[k],b=rb[k];T.stock[k]=Math.max(0,T.stock[k]-(b.cov||0));
    const cost=(c.buy||0)*rb.open*TBUY[k]*(rb.open<.99?1.3:1);if(cost>0&&S.eco.tre+inc<cost){c.buy=0;rep.push([`国庫が足りず、${x[1]}の買い付けを止めた`,'am']);}else{inc-=cost;T.log.buy+=cost;}
    const bs=tradeBuyers(k,c.to),sold=Math.min(b.sur*c.exp,bs.length);T.stock[k]=clamp(T.stock[k]+b.sur-sold+(b.ext||0),0,Math.max(c.stT,T.stock[k]));
    if(sold>0){const v=sold*TSELL[k]*TDEST[c.to][1]*rb.open;inc+=v;T.log.exp+=v;bs.slice(0,Math.ceil(sold)).forEach(i=>relAdd(i,c.to==='any'?.25:.5));}}
  // 武器輸出
  A2.offers=A2.offers.filter(o=>o.exp>S.month&&armsOK(o.to));
  for(const c of A2.list.slice()){const n=W.n[c.to],ok=natAlive()[c.to]&&!n.sanc&&!(S.lw&&S.lw.e===c.to);
    if(!ok){A2.list=A2.list.filter(y=>y!==c);rep.push([`${natN(c.to)}への${ARMS.find(a=>a[0]===c.cat)[1]}の輸出は打ち切られた`,'am']);continue;}
    inc+=c.val;T.log.arms+=c.val;S.corp[c.cat].xp+=2;relAdd(c.to,.4);if(n.bloc===2&&W.n[ME()].bloc!==2)W.rivK=Math.min(1.6,W.rivK+.002);
    if(--c.left<=0){A2.list=A2.list.filter(y=>y!==c);rep.push([`${natN(c.to)}への${ARMS.find(a=>a[0]===c.cat)[1]}の輸出が完了した`,'g']);}}
  if(S.month%3===0&&A2.pol){const m=armsOffer(RI(1,2));if(m)rep.push([`武器輸出の引き合いが${m}件届いた(国政 → 貿易)`,'']);}
  // 企業：受注と輸出で経験を積み、段階が上がる
  const ord=k=>S.orders.filter(o=>k==='yard'?o.kind==='unit':k==='aero'?o.kind==='airu'||o.k==='ftr'||o.k==='aew':k==='msl'?o.kind==='ammo':k==='land'?o.kind==='gnd':false).length;
  for(const k of CORPK){const c=S.corp[k];if(c.lv>=10)continue;c.xp+=(2+Math.min(3,ord(k))+(k==='elec'?Math.min(2,S.labs.length/3):0)+(k==='mat'?Math.min(2,bldSum('ind')/3):0))*(S.cfoc===k?1.5:1);
    if(c.xp>=corpNeed(c.lv)){c.xp-=corpNeed(c.lv);c.lv++;_M=null;grpAdd({biz:2});rep.push([`${corpName(k)}が力をつけた(${corpD(k)[1]}　段階 ${c.lv})`,'g']);wNews(`${NAT.n}の${corpName(k)}が新工場を稼働`,'');}}
  for(const b in DOC){const d=S.doc[b];if(d.k&&d.m<100)d.m=Math.min(100,d.m+5);}
  return inc;}

function autoW(u){

    if(best){fireAA(u,best,true,'sam');return;}
    if(B.hot&&!hold){for(const t of B.u){if(t.dead||t.side===u.side||t.cat!=='air'||!t.seen||t.eng>=t.n*2)continue;const d=dist(u,t);if(d<=u.samR&&d<bs){bs=d;best=t;}}if(best){fireAA(u,best,false,'sam');return;}}}

    if(best){fireAA(u,best,false,'aam');return;}
    bd=45;for(const m of B.m){if(m.dead||m.side===u.side||m.type!=='asm'||m.delay>0||!m.seen||m.eng>=2)continue;const d=dist(u,m);if(d<bd){bd=d;best=m;}}

  if(u.cat==='ship'&&u.torp>0&&u.torpCd<=0&&B.hot&&!hold){let best=null,bd=u.torpR;
    for(const t of B.u){if(t.dead||t.side===u.side||t.cat!=='sub'||!t.seen)continue;const d=dist(u,t);if(d<bd){bd=d;best=t;}}
    if(best){fireTorp(u,best,1,'asw');u.torpCd=2.5;if(u.side==='P')blog(`${u.name} 対潜攻撃 → ${best.name}`,'b');}}}

    u.ord=null;u.dx=u.dy=null;if(u.cat==='sub')u.reveal=3*(u.hide||1);if(u.cat==='air'&&u.key!=='mpa'&&o.w==='asm'&&u.asm<=0)rtb(u);

function cmdMove(wx,wy){const us=selUnits().filter(u=>!u.rtb&&u.spd>0);if(!us.length)return;let cx=0,cy=0;for(const u of us){cx+=u.x;cy+=u.y;}cx/=us.length;cy/=us.length;

function launch(kind){const c=selUnits()[0];if(!c||!c.cvf)return;if(c.deckCd>0)return toast('発着艦作業中');if(c.hp<c.max*.35)return toast('飛行甲板が損傷し、発艦できない');

function warn(){if(B.sc==='scramble')return airWarn();if(B.hot||B.over)return;if(B.warnCd>0)return toast(`次の警告まであと ${Math.ceil(B.warnCd)} 分`);

/* ---------- 敵AI ---------- */
function withdraw(why){if(B.eWd)return;B.eWd=true;B.pend=B.pend.filter(p=>!p.sp);blog(`敵部隊が撤退を始めた(${why})`,'g');banner('敵部隊　撤退開始','g');
  for(const e of B.u)if(e.side==='E'&&!e.dead&&e.cat==='sub'&&!e.seen){e.dead=true;e.esc=true;}uiRefresh(true);}
function tryFire(e,seenP){if(e.asm<=0||e.fireCd>0)return;const tg=seenP.filter(p=>dist(e,p)<=e.asmR);if(!tg.length)return;
  if(!B.hot){if(!B.willFire)return;if(B.fireAt==null)B.fireAt=B.t+(e.role==='bmr'?R(.5,3):R(4,30));if(B.t<B.fireAt)return;}
  const n=e.role==='bmr'?e.asm:Math.min(e.asm,4),wt=tg.map(p=>p.cvf?3:p.sam>=60?2:1),sum=wt.reduce((a,b)=>a+b,0);
  for(let i=0;i<n;i++){let r=Math.random()*sum,j=0;while(j<tg.length-1&&r>wt[j]){r-=wt[j];j++;}fireASM(e,tg[j],1,i*.12);}
  e.fireCd=e.role==='bmr'?999:7;blog(`${e.name} が対艦ミサイル${n}発を発射`,'r');goHot('E');}
function egress(e){e.dx=e.sx;e.dy=e.sy;if(dist(e,{x:e.sx,y:e.sy})<8){e.dead=true;e.esc=true;B.sel=B.sel.filter(i=>i!==e.id);if(B.tsel===e.id)B.tsel=null;}}
function aiThink(){
  const P=B.u.filter(u=>u.side==='P'&&!u.dead),E=B.u.filter(u=>u.side==='E'&&!u.dead);
  const flag=P.find(u=>u.cvf)||P.find(u=>u.cat==='ship')||P[0];
  if(B.t>=B.intelT&&flag){B.intelT=B.t+15;B.intel={x:clamp(flag.x+R(-B.eIn,B.eIn),4,W-4),y:clamp(flag.y+R(-B.eIn,B.eIn),4,H-4)};}
  const seenP=P.filter(u=>u.seen&&u.cat==='ship'),sp=B.pend.some(p=>p.sp);
  if(!B.eWd){
    if(B.eLost>=B.eInit*.5&&B.eLost>0)withdraw('損害甚大');
    else if(B.sc==='landing'&&!E.some(e=>e.key==='elst'))withdraw('揚陸部隊を喪失');
    else if(B.t>B.tmax)withdraw('作戦限界');
    else if(B.hot&&(B.sc==='airraid'||B.sc==='intrusion'||B.sc==='scramble')&&!sp&&!E.some(e=>e.asm>0||(e.role==='cv'&&e.air>0)))withdraw('弾薬を消耗');
    else if(B.sc==='intrusion'&&!B.hot&&B.zoneT>90){B.intruded=true;withdraw('示威を終えて引き揚げ');}}
  for(const e of E){
    if(B.eWd){egress(e);continue;}
    switch(e.role){
      case'intr':airIntr(e,P,E);break;
      case'lst':if(dist(e,B.obj)>4){e.dx=B.obj.x;e.dy=B.obj.y;}break;
      case'guard':e.dx=e.dy=null;tryFire(e,seenP);break;
      case'surf':{let tx,ty;const l=E.find(x=>x.key==='elst');
        if(l){tx=l.x+e.fx;ty=l.y+e.fy;}else if(B.hot||B.sc==='airraid'){tx=B.intel.x;ty=B.intel.y;}else{tx=B.obj.x+e.ox;ty=B.obj.y+e.oy;}
        e.dx=clamp(tx,4,W-4);e.dy=clamp(ty,4,H-4);tryFire(e,seenP);break;}
      case'bmr':if(e.asm>0){if(dist(e,B.intel)<15&&flag)B.intel={x:flag.x,y:flag.y};e.dx=B.intel.x;e.dy=B.intel.y;tryFire(e,seenP);}else egress(e);break;
      case'ftr':{const b=nearest(e,E.filter(x=>x.role==='bmr'&&x.asm>0)),pa=P.filter(u=>u.cat==='air'&&u.seen);

        else if(e.orbit){e.dx=clamp(B.obj.x+Math.cos(B.t/8+e.id)*35,4,W-4);e.dy=clamp(B.obj.y+Math.sin(B.t/8+e.id)*35,4,H-4);}
        else if(b){e.dx=b.x+(B.intel.x-b.x)*.15;e.dy=b.y+(B.intel.y-b.y)*.15;}
        else if(e.aam>0&&B.hot&&B.t<e.born+90){e.dx=B.intel.x;e.dy=B.intel.y;}
        else egress(e);break;}
      case'sub':{if(e.evade>0)e.evade-=.5;else{e.dx=B.intel.x;e.dy=B.intel.y;}
        if(B.hot&&e.torp>0&&e.torpCd<=0){const tg=P.filter(p=>p.cat!=='air'&&p.seen&&dist(e,p)<=e.torpR);
          if(tg.length){const t=nearest(e,tg);fireTorp(e,t,Math.min(2,e.torp),'torp');e.torpCd=14;e.reveal=4;e.evade=10;const a=Math.atan2(e.y-t.y,e.x-t.x);e.dx=clamp(e.x+Math.cos(a)*30,5,W-5);e.dy=clamp(e.y+Math.sin(a)*30,5,H-5);blog('敵潜水艦が魚雷を発射','r');}}
        break;}
      case'cv':e.dx=e.dy=null;if(B.hot&&e.air>=2&&e.fireCd<=0){e.fireCd=22;e.air-=2;const fk=Math.random()<.5;mkE(fk?'eftr':'ebmr',e.x,e.y,fk?'ftr':'bmr',fk?{}:{asm:4,asmR:150});blog('敵空母から航空機が発艦','am');}break;}}}
function zoneStep(dt){const o=B.obj;let inz=false,land=false;
  for(const e of B.u){if(e.dead||e.side!=='E'||e.cat!=='ship')continue;const d=dist(e,o);if(d<o.r)inz=true;if(e.key==='elst'&&d<8)land=true;}
  if(B.sc==='intrusion'&&inz&&!B.eWd){B.zoneT+=dt;if(!B.auth&&B.zoneT>5){B.auth=true;banner('領海侵入を確認　武器使用許可','am');blog('政府は海上警備行動を発令した。武器の使用が許可された','am');uiRefresh(true);}}
  if(land){B.landT+=dt;if(B.landT>=B.landNeed)finish('lose',{occupied:true});}}
function endCheck(){if(B.over)return;const P=B.u.filter(u=>u.side==='P'&&!u.dead&&u.cat!=='air'&&!u.site);if(!P.length&&!B.pend.some(p=>p.rein)&&!B.airOnly)return finish('lose',{});

function step(dt){
  B.t+=dt;if(B.satT>0)B.satT-=dt;if(B.warnCd>0)B.warnCd-=dt;if(B.vampCd>0)B.vampCd-=dt;
  for(let i=B.pend.length-1;i>=0;i--)if(B.t>=B.pend[i].t){const p=B.pend.splice(i,1)[0];p.f();}
  for(const u of B.u.slice()){if(u.dead)continue;
    if(u.reveal>0)u.reveal-=dt;u.samCd-=dt;u.aamCd-=dt;u.torpCd-=dt;u.fireCd-=dt;
    if(u.side==='P'){if(u.cat==='air'){flightStep(u,dt);if(u.dead)continue;}if(u.cvf)deckStep(u,dt);doOrd(u);}
    if(u.dx!=null){const d=Math.hypot(u.dx-u.x,u.dy-u.y),v=u.spd*(u.cat!=='air'&&u.hp<u.max*.5?.6:1)*dt;

const GW=9,GH=11,GN=GW*GH,GTN=['海','砂浜','平地','森','丘','市街'],GTD=[0,-.1,0,.25,.35,.4],GTC=['#0a2236','#b9a877','#3f6c49','#28503a','#6f6c58','#5d6470'];

let G=null;
function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const gd2=(a,b)=>Math.abs(a%GW-b%GW)+Math.abs(Math.floor(a/GW)-Math.floor(b/GW));
// 島の地形は島ごとの種から決まる。同じ島はいつも同じ形
function genIsland(seed){const r=rng32(seed),t=new Array(GN).fill(0),c0=5*GW+4;

    if(best<0)for(const i of land)if(!used.has(i)){best=i;break;}used.add(best);fac[best]=k;return best;};

  t[put('port',coast,i=>gd2(i,hq)*.3+r())]=2;
  t[put('air',land,i=>(t[i]===2?2:0)+Math.min(3,gd2(i,hq))-(isCoast(i)?1:0))]=2;
  put('radar',land,i=>(t[i]===4?3:0)+Math.min(4,gd2(i,hq))*.6);

// 本土の戦場：島の生成をもとに、海をすべて陸に変える。敵は国境の側の縁(dir 0北 1東 2南 3西)から入ってくる
function genField(seed,ter,dir){const m=genIsland(seed),r=rng32(seed+7919),t=m.t,pf=[.1,.1,.4,.5,.15,.15,.02,.08][ter]||.1,ph=[.06,.06,.08,.08,.3,.45,.12,.1][ter]||.06,edge=[];

  for(let i=0;i<GN;i++){const x=i%GW,y=Math.floor(i/GW);if(!((dir===0&&y===0)||(dir===2&&y===GH-1)||(dir===1&&x===GW-1)||(dir===3&&x===0))||m.fac[i])continue;if(t[i]===4)t[i]=2;edge.push(i);}
  return{t,fac:m.fac,beach:edge,hq:m.hq};}
const FACH={port:['駅','駅']},gfac=k=>G&&G.home&&FACH[k]||FAC[k];

/* ---------- 部隊と盤面 ---------- */

// 移動できるマス。敵に隣接したマスに入ると、そこで止まる

// 目標マスまでの道のり(部隊は無視)

/* ---------- 開始 ---------- */

  // 海面のマーカー、航跡、高度線
  for(const v of vis){const u=v.u,E=u.side==='E',col=E?'#ff6b5e':'#5fb0ff',g0=P3(v.ghost?u.ls.x:u.x,v.ghost?u.ls.y:u.y,0);if(!g0)continue;
    g.globalAlpha=v.ghost?.4:.8;g.strokeStyle=col;g.lineWidth=1.2;g.beginPath();
    if(E){g.moveTo(g0[0],g0[1]-4);g.lineTo(g0[0]+7,g0[1]);g.lineTo(g0[0],g0[1]+4);g.lineTo(g0[0]-7,g0[1]);g.closePath();}else g.ellipse(g0[0],g0[1],7,4,0,0,6.3);g.stroke();
    if(!v.ghost&&u.cat!=='ship'){g.globalAlpha=.45;g.beginPath();g.moveTo(g0[0],g0[1]);g.lineTo(v.s[0],v.s[1]);g.stroke();}
    if(!v.ghost&&u.cat==='ship'&&u.dx!=null){g.globalAlpha=.25;g.strokeStyle='#cfe6f2';g.beginPath();const bx_=u.x-Math.cos(u.hd)*m*.5,by_=u.y-Math.sin(u.hd)*m*.5;for(const a of[.35,-.35])line(bx_,by_,0,bx_-Math.cos(u.hd+a)*m*1.3,by_-Math.sin(u.hd+a)*m*1.3,0);g.stroke();}
    g.globalAlpha=1;}
  faces.sort((a,b)=>b.z-a.z);g.lineWidth=.6;
  for(const f of faces){const p=f.pts;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fillStyle=f.col;g.strokeStyle=f.col;g.fill();g.stroke();}
  // ミサイル
  for(const ms of B.m){if(ms.dead||ms.delay>0)continue;const t=ms.tm?B.mi[ms.tgt]:B.ui[ms.tgt];let tz=0;if(t)tz=ms.tm?(t.z3||0):pos3(t)[2];
    if(ms.type==='asm')ms.z3=m*.07;else if(ms.type==='torp')ms.z3=ms.asw?m*.25:-m*.12;else{if(ms.z3==null){const sh=B.u.find(u=>!u.dead&&Math.hypot(u.x-ms.x,u.y-ms.y)<3&&u.side===ms.side);ms.z3=sh?pos3(sh)[2]:0;}if(!B.paused)ms.z3+=(tz+m*.07-ms.z3)*.18;}
    const tr=ms.tr3||(ms.tr3=[]),l=tr[tr.length-1];if(!l||Math.hypot(l[0]-ms.x,l[1]-ms.y)>m*.12){tr.push([ms.x,ms.y,ms.z3]);if(tr.length>14)tr.shift();}
    if(ms.side==='E'&&!ms.seen)continue;const big=ms.type==='asm'||ms.type==='torp',col=ms.side==='P'?(ms.type==='asm'?'159,208,255':ms.type==='torp'?'127,214,226':'99,219,160'):(ms.type==='torp'?'255,176,154':'255,107,94');
    g.lineWidth=big?1.8:1.1;for(let i=1;i<tr.length;i++){g.strokeStyle=`rgba(${col},${(i/tr.length*.7).toFixed(2)})`;g.beginPath();line(tr[i-1][0],tr[i-1][1],tr[i-1][2],tr[i][0],tr[i][1],tr[i][2]);g.stroke();}
    const s=P3(ms.x,ms.y,ms.z3);if(s){if(l){g.strokeStyle=`rgba(${col},.8)`;g.beginPath();line(l[0],l[1],l[2],ms.x,ms.y,ms.z3);g.stroke();}g.fillStyle=`rgb(${col})`;g.beginPath();g.arc(s[0],s[1],big?2.6:1.7,0,6.3);g.fill();}}
  g.lineWidth=1;
  // ラベルと選択枠
  g.font='10px sans-serif';const boxes=[];
  const pr=v=>(B.sel.includes(v.u.id)||B.tsel===v.u.id)?0:v.u.side==='E'?1:v.u.cat==='air'?3:2;
  for(const v of vis.slice().sort((a,b)=>pr(a)-pr(b))){const u=v.u,E=u.side==='E',s=v.s,isSel=B.sel.includes(u.id),tg=B.tsel===u.id,r=Math.max(9,m*F/s[2]*.55);
    if(isSel||tg){g.strokeStyle=tg?'#ffd0c8':'#ffffff';const q=r+4,k=5;g.beginPath();for(const[ax,ay]of[[-1,-1],[1,-1],[1,1],[-1,1]]){g.moveTo(s[0]+ax*q,s[1]+ay*(q-k));g.lineTo(s[0]+ax*q,s[1]+ay*q);g.lineTo(s[0]+ax*(q-k),s[1]+ay*q);}g.stroke();}
    if(!v.ghost&&u.cat!=='air'&&u.hp<u.max){const w=22,hr=Math.max(0,u.hp/u.max);g.fillStyle='#1a2c3a';g.fillRect(s[0]-w/2,s[1]+r+3,w,2.5);g.fillStyle=hr>.5?'#63dba0':hr>.25?'#f2b54a':'#ff6b5e';g.fillRect(s[0]-w/2,s[1]+r+3,w*hr,2.5);}
    const t=v.ghost?u.sym+' ?':u.lab,w=g.measureText(t).width||t.length*10,b=[s[0]+r+3,s[1]-r-6,w+2,12];
    if(pr(v)>0&&boxes.some(q=>b[0]<q[0]+q[2]&&b[0]+b[2]>q[0]&&b[1]<q[1]+q[3]&&b[1]+b[3]>q[1]))continue;boxes.push(b);
    g.globalAlpha=v.ghost?.5:1;g.fillStyle=E?'#ffb3aa':'#bcdcff';g.fillText(t,b[0]+1,b[1]+10);g.globalAlpha=1;}
  const io=P3(o.x,o.y,0);if(io){g.fillStyle='#7fa3b8';g.textAlign='center';g.fillText(B.iname,io[0],io[1]+14);g.textAlign='left';}
  // 爆発
  B.fx=B.fx.filter(f=>now-f.t<700);
  for(const f of B.fx){const s=P3(f.x,f.y,f.z?za:m*.05);if(!s)continue;const a=(now-f.t)/700,rr=Math.max(3,(f.c==='kill'?m*1.1:f.c==='hit'?m*.6:m*.3)*F/s[2])*a+2;
    g.fillStyle=f.c==='kill'?`rgba(255,190,100,${(.5*(1-a)).toFixed(2)})`:f.c==='hit'?`rgba(255,107,94,${(.45*(1-a)).toFixed(2)})`:`rgba(170,230,255,${(.4*(1-a)).toFixed(2)})`;g.beginPath();g.arc(s[0],s[1],rr,0,6.3);g.fill();}
  if(B.mk&&now-B.mk.t<500){const a=(now-B.mk.t)/500;ring(B.mk.x,B.mk.y,m*.2+m*.6*a,`rgba(95,176,255,${(1-a).toFixed(2)})`);}
  g.fillStyle='#4f7089';g.fillText('3D　1マス 50km',6,14);}

/* ---------- 画面上の位置と操作 ---------- */
function scrOf(u){if(B.view==='3d'){if(!B.v3)return null;const p=pos3(u);return B.v3.P3(p[0],p[1],p[2]);}return[B.cw/2+(u.x-B.cam.x)*B.k,B.ch/2+(u.y-B.cam.y)*B.k];}
function seaAt(px,py){if(B.view!=='3d')return{x:B.cam.x+(px-B.cw/2)/B.k,y:B.cam.y+(py-B.ch/2)/B.k};const v=B.v3;if(!v)return null;const dx=px-B.cw/2,dy=-(py-B.ch/2);
  const wx=v.fx*v.F+v.rx*dx+v.ux*dy,wy=v.fy*v.F+v.ry*dx+v.uy*dy,wz=v.fz*v.F+v.uz*dy;if(wz>=-1e-6)return null;const t=-v.ez/wz;return{x:v.ex+wx*t,y:v.ey+wy*t};}
function tap(px,py){if(!B||B.over)return;let best=null,bd=B.view==='3d'?30:26;
  for(const u of B.u){if(u.dead||(u.side==='E'&&!u.seen))continue;const s=scrOf(u);if(!s)continue;const d=Math.hypot(s[0]-px,s[1]-py);if(d<bd){bd=d;best=u;}}
  if(best){if(best.side==='P'){if(B.sel.length===1&&B.sel[0]===best.id)B.sel=[];else B.sel=[best.id];}else B.tsel=B.tsel===best.id?null:best.id;}
  else{const w=seaAt(px,py);if(selUnits().length){if(w&&w.x>=0&&w.x<=W&&w.y>=0&&w.y<=H)cmdMove(w.x,w.y);}else{B.tsel=null;if(w&&B.view==='3d'){B.c3.tx=clamp(w.x,0,W);B.c3.ty=clamp(w.y,0,H);}}}
  uiRefresh(true);}
function pan3(dx,dy){const c=B.c3,k=c.d/(B.v3?B.v3.F:300),sy=Math.sin(c.yaw),cy=Math.cos(c.yaw),sp=Math.max(.25,Math.sin(c.pit));
  c.tx=clamp(c.tx+(-cy*dx-sy*dy/sp)*k,-40,W+40);c.ty=clamp(c.ty+(sy*dx-cy*dy/sp)*k,-40,H+40);}
function initDOM(){
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.t;render();window.scrollTo(0,0);});
  $('#next').addEventListener('click',nextMonth);
  $('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||b.disabled||!mq.length)return;const f=mq[0].cbs[b.dataset.m];if(f)f();else closeModal();});
  $('#bspd').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&B&&!B.over)setSpeed(+b.dataset.s);});
  $('#bact').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b&&!b.disabled)bact(b.dataset.a);});
  $('#bquit').addEventListener('click',()=>{if(!B||B.over)return;const was=B.paused;B.paused=true;
    confirmM(B.drill?'演習を打ち切る。':'海域から撤退する。事案は失敗として扱われる。',()=>finish('lose',{retreat:true}),'撤退する',()=>{if(!was)setSpeed(B.speed);});});
  document.querySelector('.zoom').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!B)return;const z=b.dataset.z;
    if(z==='v')return setView(B.view==='3d'?'2d':'3d');
    if(z==='f'){B.fol=!B.fol;if(B.fol&&!selUnits().length)toast('追尾する部隊を選ぶこと');return setView(B.view);}
    if(z==='0'){B.cam={x:W/2,y:H/2,z:1};B.c3=Object.assign({},C3DEF);B.fol=false;return setView(B.view);}
    if(B.view==='3d')B.c3.d=clamp(B.c3.d*(+z>0?1/1.4:1.4),3,900);else B.cam.z=clamp(B.cam.z*(+z>0?1.4:1/1.4),1,60);});
  const cv=$('#cv'),pts=new Map();let moved=false,start=null,pd=0,pm=null;
  const mid=()=>{const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};};
  const begin1=(x,y,e)=>{start={x,y,cx:B.cam.x,cy:B.cam.y,yaw:B.c3.yaw,pit:B.c3.pit,lx:x,ly:y,pan:!!e&&(e.shiftKey||e.button===2)};};
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{if(!B)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    if(pts.size===1){moved=false;begin1(e.offsetX,e.offsetY,e);}else if(pts.size===2){const q=mid();pd=q.d;pm=q;moved=true;}});
  cv.addEventListener('pointermove',e=>{if(!B||!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
    if(pts.size===1&&start){const dx=e.offsetX-start.x,dy=e.offsetY-start.y;if(!moved&&Math.hypot(dx,dy)>8)moved=true;if(!moved)return;
      if(B.view==='3d'){if(start.pan){pan3(e.offsetX-start.lx,e.offsetY-start.ly);start.lx=e.offsetX;start.ly=e.offsetY;}else{B.c3.yaw=start.yaw-dx*.006;B.c3.pit=clamp(start.pit+dy*.005,.1,1.52);}}
      else{B.cam.x=clamp(start.cx-dx/B.k,0,W);B.cam.y=clamp(start.cy-dy/B.k,0,H);}}
    else if(pts.size===2){const q=mid();if(B.view==='3d'){if(pd>0)B.c3.d=clamp(B.c3.d*pd/q.d,3,900);if(pm)pan3(q.x-pm.x,q.y-pm.y);}else if(pd>0)B.cam.z=clamp(B.cam.z*q.d/pd,1,60);pd=q.d;pm=q;}});
  const up=e=>{if(!B||!pts.has(e.pointerId))return;const was=pts.size;pts.delete(e.pointerId);
    if(was===1&&!moved&&e.type==='pointerup')tap(e.offsetX,e.offsetY);
    if(pts.size===1){const p=[...pts.values()][0];begin1(p.x,p.y);moved=true;}else if(pts.size===0){start=null;pm=null;}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{if(!B)return;e.preventDefault();const k=e.deltaY<0?1.15:.87;if(B.view==='3d')B.c3.d=clamp(B.c3.d/k,3,900);else B.cam.z=clamp(B.cam.z*k,1,60);},{passive:false});
  window.addEventListener('resize',fit);
  window.addEventListener('keydown',e=>{if(!B||B.over||mq.length)return;if(e.code==='Space'){e.preventDefault();setSpeed(B.paused?B.speed:0);}else if(['1','2','3','4','5'].includes(e.key))setSpeed([1,2,4,8,16][+e.key-1]);else if(e.key==='v')setView(B.view==='3d'?'2d':'3d');});
  window.addEventListener('error',e=>{try{toast('エラー: '+(e.message||''));}catch(_){}});
}
initDOM();
S=load();
if(S){applyNation(S.cfg.nat,S.cfg.riv);applyEdits(S.ed);polLoad();render();if(S.over)showOver();else if(gpNext())groundPrompt();else if(S.pending)showIncident();}
else{newGame({});render();showTitle();}
</script>
