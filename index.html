<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071421">
<title>蒼海の盾 ― 機動護衛群司令部</title>
<style>
:root{
  --bg:#071421;--pn:#0c1e2e;--pn2:#12293c;--ln:#24445c;--tx:#dbe8f0;--mut:#86a0b3;
  --bl:#5fb0ff;--rd:#ff6b5e;--am:#f2b54a;--gr:#63dba0;--cy:#7fd6e2;
  --go:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --mi:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS PMincho",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.6 var(--go);overscroll-behavior:none;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.r{color:var(--rd)}.g{color:var(--gr)}.am{color:var(--am)}.b{color:var(--bl)}.mut{color:var(--mut)}.sm{font-size:12.5px}
h1,h2,h3{font-family:var(--mi);font-weight:600;margin:0}

/* ---------- 司令部 ---------- */
#hq{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 14px 0;padding-top:max(12px,env(safe-area-inset-top))}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ttl h1{font-size:21px;letter-spacing:.32em}
.ttl span{font-size:12.5px;color:var(--cy)}
.gz{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px;margin-top:10px}
.gz label{display:block;font-size:11px;color:var(--mut)}
.gz span{font-size:16px}
.bar{display:block;height:4px;background:#16303f;margin-top:3px}
.bar>b{display:block;height:100%;background:var(--cy);max-width:100%}
.bar>b.g{background:var(--gr)}.bar>b.am{background:var(--am)}.bar>b.r{background:var(--rd)}.bar>b.b{background:var(--bl)}
.tabs{display:flex;gap:2px;margin:10px -14px 0;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);font-size:14px;white-space:nowrap}
.tabs button.on{color:var(--tx);border-bottom-color:var(--cy)}
#view{flex:1;padding:6px 14px 20px}
.sec{padding:16px 0 4px;border-bottom:1px solid #16303f}
.sec:last-child{border-bottom:0}
.sec>h2{font-size:16px;letter-spacing:.12em;margin-bottom:10px;padding-left:10px;border-left:3px solid var(--cy)}
.sec p{margin:6px 0}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 14px max(14px,env(safe-area-inset-bottom))}
.btn{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:9px 14px;line-height:1.3}
.btn:active{background:#1a3850}
.btn.pri{background:#1d4e6b;border-color:#3b88ad;color:#fff}
.btn.warn{border-color:var(--rd);color:#ffc2bb}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.4}
#next{width:100%;font-size:16px;padding:13px;letter-spacing:.15em}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:5px 14px;margin:0}
dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;text-align:right}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sbox{background:var(--pn);border-top:2px solid var(--ln);padding:8px 9px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sbox b{font-size:13.5px}
.sbox small{color:var(--mut);line-height:1.4}
.sbox.occ{border-top-color:var(--rd);background:#2a1616}
.al{padding:6px 10px;border-left:3px solid var(--ln);background:var(--pn);font-size:13.5px;color:var(--tx)}
.al.am{border-left-color:var(--am)}.al.r{border-left-color:var(--rd)}
.lg{font-size:13px;display:flex;gap:10px}
.lg span{color:var(--mut);flex:0 0 auto;font-size:12px}
.unit{background:var(--pn);border-left:3px solid var(--bl);padding:10px 12px;margin:10px 0}
.unit.away{border-left-color:var(--am)}
.uh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.uh b{font-size:16px;font-family:var(--mi);letter-spacing:.08em}
.uh small{color:var(--mut)}
.uh .loc{margin-left:auto;font-size:12.5px;color:var(--cy)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--ln);padding:0 5px;color:var(--cy);line-height:1.5}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 6px}
.st3 label{font-size:12px;color:var(--mut)}
.amm{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0}
.urow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.urow>label{flex:0 0 52px;color:var(--mut);font-size:12px}
.urow select{flex:1;min-width:0;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:6px}
.seg{display:flex;flex:1;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.seg button{flex:1;background:none;border:0;border-left:1px solid var(--ln);padding:7px 2px;font-size:12.5px;line-height:1.25}
.seg button:first-child{border-left:0}
.seg button.on{background:#1d4e6b;color:#fff}
.seg button:disabled{opacity:.3}
.seg button small{display:block;font-size:11px;color:var(--mut)}
.seg button.on small{color:#cfe6f2}
.mini{width:30px;height:28px;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:0}
.drow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #16303f;font-size:13.5px}
.drow>div:first-child{flex:0 0 38%;min-width:0}
.item{padding:10px 0;border-top:1px solid #16303f}
.item p{margin:3px 0 8px}
h3.sub{font-size:14px;margin:16px 0 2px;color:var(--cy);letter-spacing:.1em}
.off{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid #16303f;flex-wrap:wrap}
.off .os{display:flex;gap:10px;font-size:12px;color:var(--mut)}
.off .os b{color:var(--tx);margin-left:3px;font-size:14px}
.cur{background:var(--pn);padding:10px 12px;display:grid;gap:4px}
.smap{width:100%;height:auto;display:block;margin-bottom:8px}
.smap text{font-family:var(--go)}
.smap .t1{fill:#dbe8f0;font-size:11px}.smap .t2{fill:#86a0b3;font-size:9.5px}

/* ---------- モーダル ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(3,10,17,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--pn);border:1px solid var(--ln);border-top:3px solid var(--cy);max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px 18px 16px}
.mbox h2{font-size:19px;letter-spacing:.1em;margin:4px 0 10px}
.mbox p{margin:8px 0}
.mbox ul{margin:6px 0;padding-left:1.2em}.mbox li{margin:4px 0}
.alert{font-size:12.5px;letter-spacing:.2em;color:var(--am)}
.alert.r{color:var(--rd)}.alert.g{color:var(--gr)}
dl.kv2{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:13.5px}
dl.kv2 dt{color:var(--mut);white-space:nowrap}dl.kv2 dd{margin:0}
.mbtn{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pol{margin-top:10px;padding:8px 10px;background:var(--pn2);font-size:14px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#16384d;border:1px solid var(--cy);padding:8px 14px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}

/* ---------- 戦闘 ---------- */
#bt{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#040d16}
.btop{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.bclk{font-size:13px;color:var(--cy)}
.roe{font-size:11.5px;padding:2px 8px;border:1px solid;white-space:nowrap}
.roe.hold{color:var(--bl)}.roe.auth{color:var(--am)}.roe.hot{color:var(--rd);background:#34110f}.roe.wd{color:var(--gr)}
.spd{display:flex;margin-left:auto;border:1px solid var(--ln);border-radius:3px;overflow:hidden}
.spd button{background:none;border:0;border-left:1px solid var(--ln);padding:6px 0;font-size:12px;width:32px}
.spd button:first-child{border-left:0}
.spd button.on{background:var(--cy);color:#06222a}
.bmap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ban{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:6px 16px;border:1px solid var(--cy);background:rgba(6,19,32,.92);font-family:var(--mi);font-size:14px;letter-spacing:.14em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.ban.show{opacity:1}
.ban.r{border-color:var(--rd);color:var(--rd)}.ban.am{border-color:var(--am);color:var(--am)}.ban.g{border-color:var(--gr);color:var(--gr)}
.zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:3px;border:1px solid var(--ln);background:rgba(7,20,33,.85);font-size:17px}
.bobj{position:absolute;left:8px;bottom:8px;font-size:11.5px;color:var(--tx);background:rgba(6,19,32,.85);padding:4px 8px;max-width:calc(100% - 64px);border-left:2px solid var(--cy)}
.bpan{background:var(--bg);border-top:1px solid var(--ln);padding:7px 8px}
#bstat{font-size:12.5px;min-height:38px;line-height:1.5}
#bact{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:38px}
#bact button{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:8px 10px;font-size:13px;line-height:1.2}
#bact button.atk{border-color:var(--rd);color:#ffc2bb}
#bact button.am{border-color:var(--am);color:#ffe0a6}
#bact button.g{border-color:var(--gr);color:#c6f5dd}
#bact button:disabled{opacity:.35}
.blog{height:70px;overflow:auto;background:#050f19;border-top:1px solid var(--ln);padding:4px 8px max(4px,env(safe-area-inset-bottom));font-size:12px;line-height:1.55}
.blog span{color:var(--mut);margin-right:8px}
@media (min-width:900px){.blog{height:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sub{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:0 0 auto;background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:6px 12px;font-size:13px;color:var(--mut)}
.sub button.on{background:#1d4e6b;color:#fff;border-color:#3b88ad}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:5px 9px;font-size:12.5px;color:var(--mut)}
.chips button.on{background:#1d4e6b;color:#fff;border-color:#3b88ad}
.chips small{margin-left:5px;color:var(--cy)}
.chips button.on small{color:#cfe6f2}
.pips{display:flex;gap:3px;margin:5px 0}.pips i{flex:1;height:5px;background:#16303f}.pips i.on{background:var(--cy)}
.orow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #16303f;cursor:pointer;line-height:1.45}
.orow.dis{opacity:.4;cursor:default}
.orow .os{display:flex;gap:7px;font-size:11px;color:var(--mut);flex:0 0 auto}
.orow .os b{color:var(--tx);margin-left:2px;font-size:13.5px}
.flt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.flt select,.urow select,.srow input{background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:6px;color:var(--tx);min-width:0}
.chk{font-size:13px;display:flex;align-items:center;gap:5px}
.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:10px;font-size:13px}
.rkb>div{display:grid;grid-template-columns:44px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.rkb b{text-align:right}
.erow{display:grid;grid-template-columns:1.25fr 1.3fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #16303f;font-size:13px;line-height:1.4}
.erow .sk{font-size:11px;color:var(--mut)}.erow .sk b{color:var(--tx);font-size:14px;margin-left:4px}
.abl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:8px 0}
.abl label{font-size:12px;color:var(--mut)}
.grow{flex:1;min-width:0}
.tb{width:100%;border-collapse:collapse;font-size:12.5px}
.tb th,.tb td{text-align:right;padding:4px 2px;border-top:1px solid #16303f}
.tb th{color:var(--mut);font-weight:400}.tb td:first-child,.tb th:first-child{text-align:left}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px}
.srow.col{flex-direction:column;align-items:stretch;gap:4px}
.srow>label{color:var(--mut);font-size:12.5px}
.srow input{flex:0 1 190px}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:34px;height:32px;background:var(--pn2);border:1px solid var(--ln);border-radius:3px;padding:0}
.stp span{min-width:92px;text-align:center}
.mbox h2.big{font-size:30px;letter-spacing:.3em;margin:10px 0 14px}
.mbox .mbtn .btn.sm{text-align:left}
.zoom button{font-size:14px}
.zoom button.on{background:var(--cy);color:#06222a}
.orow.w{flex-direction:column;align-items:stretch;gap:3px}
.orow .o2{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>

<div id="hq">
  <header class="top">
    <div class="ttl"><h1>蒼海の盾</h1><span id="date"></span></div>
    <div class="gz">
      <div><label>資金</label><span id="gf"></span></div>
      <div><label>支持率</label><span id="gs"></span><i class="bar"><b id="gsb" class="g"></b></i></div>
      <div><label>緊張度</label><span id="gt"></span><i class="bar"><b id="gtb" class="am"></b></i></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="home">概況</button><button data-t="deploy">配置</button><button data-t="units">部隊</button><button data-t="shop">調達</button><button data-t="pers">人事</button><button data-t="rd">開発</button><button data-t="bud">予算</button>
    </nav>
  </header>
  <main id="view"></main>
  <footer class="foot"><button id="next" class="btn pri">翌月へ進む</button></footer>
</div>

<div id="bt" hidden>
  <div class="btop">
    <span class="bclk" id="bclk">T+00:00</span>
    <span class="roe hold" id="broe"></span>
    <div class="spd" id="bspd"><button data-s="0">Ⅱ</button><button data-s="1">×1</button><button data-s="2">×2</button><button data-s="4">×4</button><button data-s="8">×8</button><button data-s="16">×16</button></div>
    <button class="btn sm" id="bquit">撤退</button>
  </div>
  <div class="bmap" id="bmap">
    <canvas id="cv"></canvas>
    <div class="ban" id="bban"></div>
    <div class="bobj" id="bobj"></div>
    <div class="zoom"><button data-z="v" id="b3d" aria-label="表示の切り替え">3D</button><button data-z="f" id="bfol" aria-label="選択中の部隊を追尾" hidden>追</button><button data-z="1" aria-label="拡大">＋</button><button data-z="-1" aria-label="縮小">－</button><button data-z="0" aria-label="全体表示">◎</button></div>
  </div>
  <div class="bpan"><div id="bstat"></div><div id="bact"></div></div>
  <div class="blog" id="blog"></div>
</div>

<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 共通 ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const norm=(x,y)=>{const l=Math.hypot(x,y)||1;return{x:x/l,y:y/l};};
const nearest=(a,l)=>{let b=null,bd=1e9;for(const x of l){const d=dist(a,x);if(d<bd){bd=d;b=x;}}return b;};
const sg=n=>(n>0?'+':n<0?'−':'±')+Math.abs(n);

/* ================= データ ================= */
const SECT=['母港','北方海域','中部海域','南嶺海域'],ISL=['演習島','雪見島','中之瀬島','南嶺本島'];
const LV=['停止','低','標準','高','最大'],LVM=[0,.5,1,1.6,2.4],COSTK=.7;
// 自軍の艦種。距離はkm、速度はkm/分
const PT={
  cvl:{n:'航空護衛艦',s:'CVL',cat:'ship',hp:220,spd:.85,dA:260,dS:42,dM:30,so:8,sam:16,samR:15,samPk:.6,samRate:.35,ciws:.5,ecm:.25,aam:40,aasm:16,fcap:10,acap:1,crew:500,cost:3200,up:30,build:24,val:120,d:'戦闘機と早期警戒機を運用する艦隊の中核'},
  ddg:{n:'ミサイル護衛艦',s:'DDG',cat:'ship',hp:140,spd:.9,dA:450,dS:42,dM:45,so:15,sam:60,samR:150,samPk:.72,samRate:.2,ciws:.5,ecm:.3,asm:8,asmR:150,asmDmg:55,torp:6,torpR:20,crew:300,cost:1800,up:18,build:18,val:100,d:'広域防空の要。SAMを60発積む'},
  dd:{n:'汎用護衛艦',s:'DD',cat:'ship',hp:110,spd:.9,dA:250,dS:90,dM:36,so:30,sam:24,samR:50,samPk:.65,samRate:.3,ciws:.5,ecm:.25,asm:8,asmR:150,asmDmg:55,torp:8,torpR:20,crew:200,cost:800,up:10,build:12,val:60,d:'哨戒ヘリを積み、対潜と対水上の探知に優れる'},
  ffm:{n:'多機能護衛艦',s:'FFM',cat:'ship',hp:80,spd:.9,dA:180,dS:70,dM:30,so:22,sam:12,samR:12,samPk:.6,samRate:.35,ciws:.5,ecm:.25,asm:8,asmR:150,asmDmg:55,torp:4,torpR:15,crew:90,cost:500,up:6,build:9,val:40,d:'省人化された小型艦。数を揃えやすい'},
  ss:{n:'潜水艦',s:'SS',cat:'sub',hp:70,spd:.6,dA:0,dS:35,dM:0,so:50,asm:4,asmR:120,asmDmg:55,torp:12,torpR:25,crew:70,cost:700,up:7,build:14,val:55,d:'探知されにくい。長魚雷は一撃が重い'},

  if(f==='m')return s+Math.round(a)+'分';if(f==='-m')return (v>=0?'−':'+')+Math.round(a)+'分';if(f==='km')return s+Math.round(a)+'km';return s+(Math.round(a*100)/100);}

function postMap(){if(_PM)return _PM;const m={};for(const o of S.off)if(o.post)m[o.post]=o;return _PM=m;}
const effAb=(o,k)=>o[k]+(k==='cool'&&o.tr.includes('cool')?3:0);

  for(const u of S.units){const sub=PT[u.type].cat==='sub';for(const p of shipPosts(u))a.push({id:u.id+':'+p[0],n:(sub&&SUBL[p[0]])||p[1],rk:p[2],ab:p[3],g:'u'+u.id,u,k:p[0],sp:sub?2:p[4]});}
  return a;}
function pickW(a){return a[Math.floor(Math.random()*a.length)];}
function genOff(rank){const sp=pickW([0,0,0,0,1,1,2,3,3,4,5,6]),b=4+rank*1.1;
  const o={id:++S.oid,name:pick(SUR)+' '+pick(GIV),rank,age:23+rank*5+RI(0,4)+(rank>4?RI(0,3):0),sp,pot:RI(11,20),merit:RI(0,20)+rank*4,tig:RI(0,3),sat:RI(55,85),post:null,sch:null,tr:[],bt:0};
  for(const k of ABK)o[k]=clamp(Math.round(b+R(-2.5,3.5)),2,19);

function postScore(o,p){if(o.sch)return -1;const lo=p.rk[0],hi=p.rk[1];if(o.rank>hi||o.rank<lo-1)return -1;return effAb(o,p.ab)*2+(o.rank<lo?-6:0)+(p.sp!=null&&o.sp===p.sp?3:0)+o.cmd*.3+o.merit*.01;}
function cleanPosts(){_PM=null;const ps={};for(const p of allPosts())ps[p.id]=p;const seen={};
  for(const o of S.off){if(!o.post)continue;const p=ps[o.post];if(!p||o.rank>p.rk[1]||o.sch||seen[o.post]){o.post=null;continue;}seen[o.post]=1;}_PM=null;}
function autoAssign(){_PM=null;const pm=postMap(),posts=allPosts().filter(p=>!pm[p.id]);if(!posts.length)return 0;
  const pri=p=>p.id==='hq:cs'?100:p.k==='co'?90+PT[p.u.type].val/100:p.g==='hq'?70:p.k==='we'||p.k==='op'?60:p.g==='org'?50:40;
  posts.sort((a,b)=>pri(b)-pri(a));let n=0;const free=S.off.filter(o=>!o.post&&!o.sch);
  for(const p of posts){let best=null,bs=0;for(const o of free){if(o.post)continue;const s=postScore(o,p);if(s>bs){bs=s;best=o;}}if(best){best.post=p.id;n++;}}
  _PM=null;_M=null;return n;}
function crewK(){let v=0;for(const l of LINE)if(l[3]==='crewReq')v+=l[4]*lvOf(l[0]);return 1-clamp(v,0,.4);}
function airCount(){return S.units.reduce((a,u)=>a+(u.ftr||0)+(u.aew||0),0)+S.pool.ftr+S.pool.aew;}
function reqRates(){const r={},k=crewK();for(const x of RATE)r[x[0]]=0;
  for(const u of S.units){const t=PT[u.type],q=t.cat==='sub'?RQ.sub:t.fcap?RQ.cv:RQ.ship;for(const a in q)r[a]+=t.crew*k*q[a];const ac=(u.ftr||0)+(u.aew||0);r.avm+=ac*9;r.avo+=ac*3;}
  r.avm+=(S.pool.ftr+S.pool.aew)*5;for(const a in r)r[a]=Math.round(r[a]+(a==='sup'||a==='med'||a==='com'?40:12));return r;}
function reqPers(){const r=reqRates();let s=0;for(const k in r)s+=r[k];return s;}
function enlTotal(){let s=0;for(const k in S.enl)s+=S.enl[k].n;return s;}
function fill(){return enlTotal()/Math.max(1,reqPers());}

function mods(){if(_M)return _M;const M={};for(const k in STAT)M[k]=0;
  for(const l of LINE){const v=lvOf(l[0]);if(v)M[l[3]]+=l[4]*v;}
  for(const p of PROJ)if(p.fx&&S.flags[p.k])for(const k in p.fx)M[k]+=p.fx[k];
  BITEM.forEach((b,i)=>{M[b[4]]+=b[5]*(S.bud[i]-2);});
  const pm=postMap(),has=(id,t)=>!!pm[id]&&pm[id].tr.includes(t),ab=(id,k)=>pm[id]?effAb(pm[id],k)-10:-4,cs=clamp(1+ab('hq:cs','adm')*.03,.8,1.4),st=(id,k)=>ab(id,k)*cs;
  M.reinT+=st('hq:n3','cmd')*1.5;M.q+=st('hq:n3','cmd')*.003;M.intel+=st('hq:n2','tec')*.02;M.satT+=st('hq:n2','tec');
  M.upk+=st('hq:n4','adm')*.004+(has('hq:n4','thrift')?.02:0);M.cec+=st('hq:n6','tec')*.01;M.radM+=st('hq:n6','tec')*.005;M.trGain+=st('hq:n7','cmd')*.03;
  M.attr+=st('hq:n1','adm')*.01;M.offGrow+=st('hq:n1','adm')*.02;M.budg+=st('hq:n5','adm')*.01+(has('hq:n5','pol')?.08:0)+(has('hq:cs','pol')?.08:0);M.projRisk+=st('hq:n5','adm')*.008;
  M.cost+=st('hq:n8','adm')*.004+(has('hq:n8','thrift')?.02:0);M.support+=st('hq:pa','cool')*.03;M.prePen+=st('hq:ja','cool')*.02;
  M.warn+=st('hq:ja','cool')*.006+(has('hq:ja','intl')?.03:0)+(has('hq:pa','intl')?.02:0);M.tension+=has('hq:ja','intl')?.05:0;
  M.ftrAam+=st('hq:av','atk')*.004+(has('hq:av','ace')?.03:0);M.deck+=st('hq:av','atk')*.01+(has('hq:av','ace')?.1:0);
  M.dockSpd+=ab('base:0','adm')*.01;M.offGrow+=ab('sch:0','adm')*.03;M.enlTr+=ab('sch:1','tec')*.02;M.recSk+=ab('sch:2','cmd')*.3;
  let men=0;for(const id in pm){const o=pm[id];if(o.rank>=5&&o.tr.includes('mentor'))men++;if(id.startsWith('hq:')&&o.tr.includes('char'))M.morale+=.1;}M.offGrow+=Math.min(.3,men*.05);
  const rq=reqRates();for(const r of RATE){const e=S.enl[r[0]],need=rq[r[0]];if(!need||!e)continue;M[r[2]]+=r[3]*((clamp(e.n/need,.5,1)-1)*2+(e.sk-60)/100*.5);}
  return _M=M;}
function unitQ(u){const M=mods(),rd=u.rd<30?.8:u.rd<50?.9:1;if(!PT[u.type].crew)return clamp((.85+M.usv*.5)*rd,.3,1.15);
  return clamp((0.6+0.4*u.tr/100)*rd*(.9+.1*S.pers.morale/100)*(.7+.3*clamp(fill(),.5,1))+M.q,.3,1.15);}
const ftrCap=u=>PT[u.type].fcap+(u.mods.includes('k_deck')?4:0),aewCap=u=>PT[u.type].acap;
function cap(u){const t=PT[u.type],M=mods();return{sam:Math.round((t.sam||0)*(1+M.samCap)*(u.mods.includes('k_vls')?1.4:1)),asm:Math.round((t.asm||0)*(1+M.asmCap)),torp:t.torp||0,aam:t.aam||0,aasm:t.aasm||0};}
function upkeep(){return S.units.reduce((a,u)=>a+PT[u.type].up*(1+u.mods.length*.03)+(u.mode==='drill'?8:0)+(u.ftr||0)*2+(u.aew||0)*3,0)*(1-clamp(mods().upk,-.3,.4))+S.pool.ftr+S.pool.aew;}
function scaleK(sc){return sc==='p'?reqPers()/2300:sc==='u'?Math.max(.4,S.units.reduce((a,u)=>a+PT[u.type].up,0)/110):sc==='a'?Math.max(.3,airCount()/9):1;}
function itemCost(i,L){const b=BITEM[i];return b[2]*COSTK*LVM[L==null?S.bud[i]:L]*scaleK(b[3])*(1-clamp(mods().cost,-.2,.3));}
const labCost=l=>8*l.lv*LVM[l.fund];
function labRP(l){const o=postMap()['lab:'+l.id],dir=o?(o.tec-10)*.03+(o.tr.includes('tech')?.1:0):-.1;return LABRP[l.lv]*LVM[l.fund]*(LABT[l.t].eff||1)*(1+dir)*(1+mods().rp);}
function catCost(c){let s=0;BITEM.forEach((b,i)=>{if(b[1]===c)s+=itemCost(i);});if(c===4)for(const l of S.labs)s+=labCost(l);return s;}
const debtPay=()=>S.debts.reduce((a,d)=>a+d.per,0);

const income=()=>Math.round(S.budget/12);
function reserve(){return S.units.filter(u=>u.sector===0&&u.mode==='normal'&&PT[u.type].val>=10);}

function enemyPower(){return Math.round((420+Math.min(S.month,120)*10+Math.max(0,S.month-120)*4)*(.5+.5*S.cfg.eGrow));}

function price(k){const M=mods(),t=PT[k],s=SHOPX[k];return Math.round(t?t.cost*(1-clamp(M.buildC,0,.4)):s.cost*(s.kind==='ammo'?1-clamp(M.ammoC,-.2,.5):1));}

function addUnit(type,o){o=o||{};const free=(NAMES[type]||[]).filter(n=>!S.used.includes(n)),name=free.length?free[0]:PT[type].s+'-'+String(++S.seq).padStart(2,'0');S.used.push(name);

  S={v:2,cfg:C,month:0,fy:0,funds:C.funds,budget:C.budget,support:C.support,tension:C.tension,bud:BITEM.map(()=>2),units:[],used:[],seq:0,pool:{ftr:0,aew:0},

    res:{},labs:[],projs:{},flags:{},unlock:{},kits:{},sectors:[null,{threat:30,held:true,est:30},{threat:38,held:true,est:38},{threat:52,held:true,est:52}],

    if(PT[k].fcap){u.ftr=Math.min(ftr,PT[k].fcap);ftr-=u.ftr;u.aew=Math.min(aew,PT[k].acap);aew-=u.aew;}}
  S.pool.ftr=ftr;S.pool.aew=aew;const sc=Math.max(.5,S.units.length/8);for(const k in S.stock)S.stock[k]=Math.round(S.stock[k]*sc);

function reload(){const order=[...S.units].sort((a,b)=>a.sector-b.sector);let short=false;
  for(const u of order){const c=cap(u);for(const k in c){const need=c[k]-(u.load[k]||0);if(need>0){const give=Math.min(need,S.cfg.sandbox?need:S.stock[STK[k]]);u.load[k]=(u.load[k]||0)+give;if(!S.cfg.sandbox)S.stock[STK[k]]-=give;if(give<need)short=true;}else if(need<0)u.load[k]=c[k];}}
  return short;}
function deliver(o,rep){
  if(o.kind==='unit'){const u=addUnit(o.k);rep.push([`就役：${PT[o.k].n}「${u.name}」(母港)`,'g']);}
  else if(o.kind==='air'){S.pool[o.k]+=o.q;rep.push([`納入：${o.n}(予備機へ)`,'g']);}
  else if(o.kind==='ammo'){S.stock[o.k]+=o.q;rep.push([`納入：${o.n}`,'']);}
  else if(o.kind==='lab'){S.labs.push({id:++S.lid,t:o.t,lv:1,fund:2,cur:null,auto:true,foc:-1});rep.push([`新設：${LABT[o.t].n}`,'g']);}}
function distribute(n,due){if(n<=0)return;const rq=reqRates(),P=S.pers,pend={};for(const p of P.pipe)pend[p.r]=(pend[p.r]||0)+p.n;
  let w=RATE.map(r=>Math.max(0,(rq[r[0]]||0)-S.enl[r[0]].n-(pend[r[0]]||0))),sum=w.reduce((a,b)=>a+b,0);
  if(sum<=0){w=RATE.map(r=>rq[r[0]]||0);sum=w.reduce((a,b)=>a+b,0)||1;}
  if(P.pol!=='auto'){const i=RATE.findIndex(r=>r[0]===P.pol);if(i>=0){w=w.map(x=>x*.5/sum);w[i]+=.5;sum=1;}}
  let left=n;RATE.forEach((r,i)=>{const k=Math.min(left,Math.round(n*w[i]/sum));if(k>0){P.pipe.push({n:k,r:r[0],due});left-=k;}});
  if(left>0)P.pipe.push({n:left,r:RATE[w.indexOf(Math.max(...w))][0],due});}
function monthlyPers(rep,M){const P=S.pers,dep=S.units.filter(u=>u.sector>0).length/Math.max(1,S.units.length),f0=fill();
  P.morale=clamp(P.morale+M.morale+(dep>.7?-1.2:dep<.4?.5:0)+(f0<.85?-1.5:0)+(60-P.morale)*.03,5,100);
  const ar=clamp((.0065+(55-P.morale)*.0002)*(1-clamp(M.attr,-.5,.7)),.0015,.03);
  for(const r of RATE){const e=S.enl[r[0]];e.n=Math.max(0,e.n-Math.round(e.n*ar*R(.6,1.4)));e.sk=clamp(e.sk+.25+M.enlTr+M.trGain*.2-(e.sk-55)*.012,20,98);}
  if(P.resv&&S.month>=P.resvEnd){const rq=reqRates(),tot=reqPers();for(const r of RATE){const e=S.enl[r[0]];e.n=Math.max(0,e.n-Math.round(P.resv*(rq[r[0]]||0)/Math.max(1,tot)));}P.resv=0;rep.push(['予備自衛官の招集を解除した','']);}
  distribute(Math.round(reqPers()*.0062*(1+clamp(M.recruit,-.8,1.5))*(.6+S.support/125)),S.month+3);
  P.pipe=P.pipe.filter(p=>{if(S.month<p.due)return true;const e=S.enl[p.r],sk=38+M.recSk*6;e.sk=(e.sk*e.n+sk*p.n)/Math.max(1,e.n+p.n);e.n+=p.n;return false;});
  if(f0>=.85&&fill()<.85)rep.push(['人員充足率が85%を割った','am']);
  const posts={};for(const p of allPosts())posts[p.id]=p;
  for(const o of S.off.slice()){
    if(o.sch){if(S.month>=o.sch.until){const c=COURSE.find(x=>x[0]===o.sch.k);for(const k in c[4])o[k]=clamp(o[k]+c[4][k],1,20);o.merit+=8;if(o.sch.k==='abr'&&!o.tr.includes('intl')&&Math.random()<.5)o.tr.push('intl');o.sch=null;rep.push([`${o.name}${RANK[o.rank]}：${c[1]}を修了`,'g']);}continue;}
    const p=o.post&&posts[o.post];
    if(p){o.sat=Math.min(100,o.sat+1);o.merit+=(.4+o.rank*.05)*(o.tr.includes('amb')?1.3:1);if(Math.random()<.05*(1+clamp(M.offGrow,-.5,2))&&o[p.ab]<o.pot)o[p.ab]++;}
    else if(o.rank>=3){o.sat-=2;if(o.sat<20&&Math.random()<.04){S.off=S.off.filter(x=>x!==o);if(o.rank>=4)rep.push([`${o.name}${RANK[o.rank]}が処遇への不満から退職した`,'am']);}}}
  _PM=null;}
function annualPers(){const P=S.pers,L=[],M=mods();let ret=0,pro=0;
  for(const o of S.off.slice()){o.age++;o.tig++;if(o.sch)continue;if(o.age>=RET[o.rank]||(o.tr.includes('frail')&&Math.random()<.15)){S.off=S.off.filter(x=>x!==o);ret++;if(o.rank>=5)L.push(`${o.name}${RANK[o.rank]}が退官`);}}
  const N=S.off.length;
  for(let r=6;r>=0;r--){const need=Math.max(r>=6?1:2,Math.round(N*RFRAC[r+1]))-S.off.filter(o=>o.rank===r+1).length;if(need<=0)continue;
    const c=S.off.filter(o=>o.rank===r&&o.tig>=TIG[r]&&!o.sch).sort((a,b)=>b.merit-a.merit);
    c.slice(0,need).forEach(o=>{o.rank++;o.tig=0;o.merit*=.4;o.sat=Math.min(100,o.sat+15);pro++;if(o.rank>=5)L.push(`${o.name}が${RANK[o.rank]}に昇任`);});
    c.slice(need).forEach(o=>{if(o.tr.includes('amb'))o.sat-=12;});}
  const inN=Math.max(2,Math.round(allPosts().length*.09*(1+clamp(M.cadet,-.6,1))));for(let i=0;i<inN;i++){const o=genOff(0);o.age=RI(22,25);o.merit=0;o.tig=0;}
  P.sp=0;cleanPosts();if(P.auto)autoAssign();P.rep=[`退官・退職 ${ret}名、昇任 ${pro}名、新任3尉 ${inN}名`].concat(L.slice(0,6));return P.rep;}
function autoPick(lab){const busy=S.labs.filter(l=>l!==lab&&l.cur).map(l=>l.cur),ds=lab.foc>=0?[lab.foc]:LABT[lab.t].d;let best=null,bc=1e9;

  let h=`<section class="sec"><h2>海域情勢</h2><div class="sgrid">`;
  for(let i=1;i<=3;i++){const s=S.sectors[i],lv=thr(i),us=S.units.filter(u=>u.sector===i);
    h+=`<div class="sbox ${s.held?'':'occ'}"><b>${SECT[i]}</b><span class="${s.held?lv.c:'r'}">${s.held?'敵活動 '+lv.t:ISL[i]+' 占領下'}</span>${bar(s.held?lv.v:100,s.held?lv.c:'r')}<small>${us.length?us.map(u=>u.name).join('・'):'展開なし'}</small>${!s.held?`<button class="btn sm warn" onclick="A.retake(${i})">奪還作戦を発動</button>`:''}</div>`;}
  h+=`</div></section>`;
  if(al.length)h+=`<section class="sec"><h2>要対処</h2>${al.map(a=>`<p class="al ${a[1]}">${a[0]}</p>`).join('')}</section>`;
  h+=`<section class="sec"><h2>今月の見通し</h2><dl class="kv"><dt>防衛予算(月割)</dt><dd class="g">+${inc} 億円</dd><dt>維持費と各種経費</dt><dd>−${cost} 億円</dd><dt>差引</dt><dd class="${inc-cost<0?'r':'g'}">${sg(inc-cost)} 億円</dd><dt>抑止力(我／敵)</dt><dd>${Math.round(fleetPower())}／${enemyPower()}</dd><dt>技術の蓄積</dt><dd>${totalLv()}段階</dd><dt>戦績</dt><dd>${S.stats.wins}勝 ${S.stats.loss}敗(うち無血 ${S.stats.blood0})</dd><dt>任期</dt><dd>${Math.floor(S.month/12)+1}年目／全${C.years}年</dd></dl></section>`;
  h+=`<section class="sec"><h2>記録</h2>${S.log.length?S.log.slice(0,12).map(l=>`<p class="lg ${l.c}"><span>${dateStr(l.m)}</span>${l.msg}</p>`).join(''):'<p class="mut sm">まだ記録はない</p>'}</section>`;
  h+=`<section class="sec"><div class="brow"><button class="btn sm" onclick="A.drill()">図上演習(戦闘の練習)</button><button class="btn sm" onclick="A.help()">遊び方</button><button class="btn sm" onclick="A.reset()">新しく始める</button></div></section>`;
  return h;};
VIEW.deploy=()=>{let h=`<section class="sec"><h2>作戦海域</h2>${mapSVG()}<p class="mut sm">事案は敵の活動が活発な海域ほど起きやすい。展開した艦は最初から現場にいて、兵力が大きいほどその海域の敵活動を抑え込む。ただし毎月、整備度が下がる。母港の艦はどの海域にも増援に出られるが、到着は戦闘開始の${reinTime()}分後になる。</p></section><section class="sec"><h2>部隊の配置</h2>`;
  for(const u of S.units){const lock=u.mode!=='normal';
    h+=`<div class="drow"><div><span class="tag">${PT[u.type].s}</span> ${u.name}${lock?` <small class="am">${u.refit?'改修中':u.mode==='dock'?'整備中':'演習中'}</small>`:''}</div><div class="seg">${SECT.map((n,i)=>`<button class="${u.sector===i?'on':''}" ${lock&&i>0?'disabled':''} onclick="A.sector(${u.id},${i})">${n.replace('海域','')}</button>`).join('')}</div></div>`;}
  return h+'</section>';};
VIEW.units=()=>{const st=S.stock,pm=postMap();
  let h=`<section class="sec"><h2>在庫</h2><dl class="kv"><dt>艦対空ミサイル</dt><dd>${st.sam}</dd><dt>対艦ミサイル</dt><dd>${st.asm}</dd><dt>空対空ミサイル</dt><dd>${st.aam}</dd><dt>魚雷・対潜弾</dt><dd>${st.torp}</dd><dt>予備機(戦闘機／早期警戒機)</dt><dd>${S.pool.ftr}／${S.pool.aew}</dd></dl><p class="mut sm">弾薬は月が替わるときに在庫から各艦へ自動で補給される。</p></section><section class="sec"><h2>艦艇 ${S.units.length}隻</h2>`;
  for(const u of S.units){const t=PT[u.type],c=cap(u),ps=shipPosts(u),vac=ps.filter(p=>!pm[u.id+':'+p[0]]).length;
    h+=`<div class="unit ${u.sector>0?'away':''}"><div class="uh"><span class="tag">${t.s}</span><b>${u.name}</b><small>${t.n}</small><span class="loc">${u.refit?`改修中 あと${u.refit.left}か月`:u.mode==='dock'?'ドック整備中':u.mode==='drill'?'演習中':SECT[u.sector]}</span></div>
      <div class="st3"><div><label>練度 ${Math.round(u.tr)}</label>${bar(u.tr,'b')}</div><div><label>整備度 ${Math.round(u.rd)}</label>${bar(u.rd,u.rd<40?'r':u.rd<60?'am':'g')}</div><div><label>船体 ${Math.round(u.hp)}%</label>${bar(u.hp,u.hp<50?'r':u.hp<80?'am':'g')}</div></div>
      <div class="amm">${Object.keys(c).filter(k=>c[k]).map(k=>`<span class="${(u.load[k]||0)<c[k]?'am':''}">${AMN[k]} ${u.load[k]||0}/${c[k]}</span>`).join('')}<span class="mut">戦闘効率 ${Math.round(unitQ(u)*100)}%</span></div>
      ${t.fcap?`<div class="urow"><label>搭載機</label><span>戦闘機 ${u.ftr}/${ftrCap(u)}</span><button class="mini" onclick="A.air(${u.id},'ftr',1)" aria-label="戦闘機を積む">＋</button><button class="mini" onclick="A.air(${u.id},'ftr',-1)" aria-label="戦闘機を降ろす">－</button><span>警戒機 ${u.aew}/${aewCap(u)}</span><button class="mini" onclick="A.air(${u.id},'aew',1)" aria-label="警戒機を積む">＋</button><button class="mini" onclick="A.air(${u.id},'aew',-1)" aria-label="警戒機を降ろす">－</button></div>`:''}
      ${ps.length?`<div class="urow"><label>幹部</label><span class="grow sm">艦長 ${oname(pm[u.id+':co'])}${vac?`　<span class="am">欠員${vac}</span>`:''}</span><button class="btn sm" onclick="A.gopost(${u.id})">補職</button></div>`:''}
      <div class="urow"><label>改修</label><span class="grow sm">${u.mods.length?u.mods.map(k=>KIT[k].n).join('、'):'なし'}</span><button class="btn sm" onclick="A.kit(${u.id})">改修・除籍</button></div>
      <div class="urow"><label>運用</label><div class="seg">${['normal','drill','dock'].map((m,i)=>`<button class="${u.mode===m?'on':''}" ${u.refit?'disabled':''} onclick="A.mode(${u.id},'${m}')">${['通常','演習','ドック整備'][i]}</button>`).join('')}</div></div></div>`;}
  return h+`<p class="mut sm">演習は練度が大きく伸びるが整備度が下がり、月8億円かかる。ドック整備は整備度と船体を回復する。どちらも母港で行う。</p></section>`;};
VIEW.shop=()=>{
  let h=`<section class="sec"><h2>発注中</h2>${S.orders.length?S.orders.map(o=>`<div class="drow"><div style="flex:1">${o.n}</div><div class="mut">あと ${o.due-S.month} か月</div></div>`).join(''):'<p class="mut sm">発注中のものはない</p>'}</section><section class="sec"><h2>調達</h2><p class="mut sm">400億円以上のものは、一括払いか分割払いかを選べる。艦は母港で就役する。</p>`;
  const item=(k,n,d)=>{const c=price(k);return `<div class="item"><div class="uh"><b>${n}</b><span class="loc">${c.toLocaleString()}億円／${buildMo(k)}か月</span></div><p class="sm mut">${d}</p><button class="btn sm" ${canPay(c)||c>=400?'':'disabled'} onclick="A.buy('${k}')">発注する</button></div>`;};
  h+='<h3 class="sub">艦艇</h3>';const locked=[];
  for(const k of SHIPK){const t=PT[k];if(t.lock&&!S.unlock[k]){locked.push(t.n);continue;}h+=item(k,t.n,`${t.d}。乗員${t.crew}名、維持費は月${t.up}億円`);}
  if(locked.length)h+=`<p class="sm mut">開発計画を終えると調達できる：${locked.join('、')}</p>`;
  h+='<h3 class="sub">航空機</h3>';for(const k of['ftr','aew'])h+=item(k,SHOPX[k].n,SHOPX[k].d);
  h+='<h3 class="sub">弾薬</h3>';for(const k of['sam','asm','aam','torp'])h+=item(k,SHOPX[k].n,SHOPX[k].d+`(在庫 ${S.stock[k]})`);
  return h+'</section>';};
function render(){if(!S)return;
  $('#date').textContent=dateStr(S.month)+'　'+(Math.floor(S.month/12)+1)+'年目';
  const gf=$('#gf');gf.textContent=S.cfg.sandbox?'無制限':Math.round(S.funds).toLocaleString()+' 億円';gf.className=S.funds<0?'r':'';
  $('#gs').textContent=Math.round(S.support)+'%';const sb=$('#gsb');sb.style.width=S.support+'%';sb.className=S.support<25?'r':S.support<45?'am':'g';
  $('#gt').textContent=Math.round(S.tension)+'%';const tb=$('#gtb');tb.style.width=S.tension+'%';tb.className=S.tension>=65?'r':S.tension>=40?'am':'g';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===ui.tab));
  $('#view').innerHTML=VIEW[ui.tab]();$('#next').disabled=!!S.over;}

/* ---------- モーダル・トースト ---------- */
const mq=[];
function showM(){$('#mbox').innerHTML=mq[0].html;$('#modal').hidden=false;$('#mbox').scrollTop=0;}
function modal(html,cbs){mq.push({html,cbs:cbs||{}});if(mq.length===1)showM();}
function closeModal(){mq.shift();if(mq.length)showM();else $('#modal').hidden=true;}
function confirmM(text,yes,yl,no){modal(`<p>${text}</p><div class="mbtn"><button class="btn pri" data-m="y">${yl||'実行する'}</button><button class="btn" data-m="n">やめる</button></div>`,{y:()=>{closeModal();yes();},n:()=>{closeModal();if(no)no();}});}
function toast(msg){const t=$('#toast');t.textContent=msg;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className='';},2600);}
function showIncident(){const inc=S.pending;if(!inc)return;const us=S.units.filter(u=>u.sector===inc.sector&&u.mode==='normal'),rn=reserve(),rt=inc.type==='retake',can=us.length||rn.length;
  modal(`<div class="alert r">${rt?'作戦計画':'事案発生'}</div><h2>${SECT[inc.sector]}　${SCN[inc.type].n}</h2><p>${SCN[inc.type].d(inc)}</p><dl class="kv2"><dt>敵情(推定)</dt><dd>${inc.intel}</dd><dt>現場の兵力</dt><dd>${us.length?us.map(u=>u.name).join('、'):'<b class="r">展開部隊なし</b>'}</dd><dt>母港からの増援</dt><dd>${rn.length?rn.map(u=>u.name).join('、')+`<br><span class="mut sm">戦闘開始の${reinTime()}分後に、海域の南西へ到着する</span>`:'なし'}</dd></dl><div class="mbtn">${can?`<button class="btn pri" data-m="fight">出撃し、自ら指揮を執る</button><button class="btn" data-m="auto">現場指揮官に任せる(自動解決)</button>`:''}<button class="btn" data-m="ignore">${rt?'作戦を中止する':can?'静観する':'対処できない(静観)'}</button></div>`,
  {fight:()=>{closeModal();if(can)startBattle(inc);else ignoreInc(inc);},auto:()=>{closeModal();if(can)autoResolve(inc);else ignoreInc(inc);},ignore:()=>{closeModal();if(rt){S.pending=null;save();render();}else ignoreInc(inc);}});}
function showOver(){const o=S.over,occ=[1,2,3].filter(i=>!S.sectors[i].held).length,st=S.stats;
  const score=st.wins*100+st.blood0*80+Math.round(S.support)*5-st.pSunk*60-occ*250+Math.min(S.month,60)*10+totalLv()+(o.k==='peace'?800:0);
  const rank=score>=2000?'S':score>=1400?'A':score>=900?'B':score>=400?'C':'D';
  modal(`<div class="alert ${o.k==='lost'||o.k==='fired'?'r':'g'}">${dateStr(S.month)}</div><h2>${o.t}</h2><p>${o.d}</p><dl class="kv2"><dt>戦績</dt><dd>${st.wins}勝 ${st.loss}敗(無血 ${st.blood0})</dd><dt>撃沈／喪失</dt><dd>${st.eSunk}隻／${st.pSunk}隻</dd><dt>確保した島</dt><dd>${3-occ}／3</dd><dt>技術の蓄積</dt><dd>${totalLv()}段階</dd><dt>最終支持率</dt><dd>${Math.round(S.support)}%</dd><dt>評価</dt><dd><b class="am">${rank}</b>(${score}点)</dd></dl><div class="mbtn"><button class="btn pri" data-m="new">新しい任期を始める</button><button class="btn" data-m="ok">記録を眺める</button></div>`,
  {new:()=>{closeModal();showTitle();}});}
function showHelp(){const C=S.cfg;modal(`<div class="alert">着任</div><h2>${esc(C.fleetName)}司令部</h2><p>${C.cmdr?esc(C.cmdr)+'司令。':''}あなたは${esc(C.nation)}海上防衛軍の艦隊を預かる。任期の${C.years}年間、3つの島嶼を守り抜く。支持率が0%になれば更迭される。</p>
<ul class="sm"><li><b>配置・部隊</b>：艦を海域に出し、演習・整備・改修を回す</li><li><b>人事</b>：幹部を艦と司令部のポストに就け、曹士の職種ごとの充足を保つ。任せきりにもできる</li><li><b>開発</b>：研究所ごとに課題を進め、技術が揃えば新しい艦や装備の開発計画に着手できる</li><li><b>予算</b>：64の費目に配分し、年度替わりには増額を折衝する</li><li><b>翌月へ進む</b>で時間が進み、事案が起きれば戦闘になる</li></ul>
<p><b>戦闘の操作</b></p><ul class="sm"><li>自部隊をタップで選択、海面をタップで移動、敵をタップで目標に指定</li><li>右下の「3D」で立体表示に切り替えられる。ドラッグで視点を回し、2本指で拡大と移動</li><li>海面すれすれのミサイルは艦のレーダーでは30〜45kmまで見えない。早期警戒機と戦闘機を前に出すと早く見つかる</li><li>敵が撃つか領海に居座るまで、武器は使えない。艦を相手の50km以内に寄せて「警告」し、退去させれば最良の結果になる</li></ul>
<div class="mbtn"><button class="btn pri" data-m="ok">任務に就く</button></div>`);}
function showPeace(){modal(`<div class="alert g">緊張緩和</div><h2>海は1年のあいだ静かだった</h2><p>抑止が機能し、両国は海上連絡メカニズムの運用に合意した。ここで退任すれば、平和をもたらした司令として評価される。任期を続けることもできる。</p><div class="mbtn"><button class="btn pri" data-m="pc">任期を続ける</button><button class="btn" data-m="pe">ここで退任する</button></div>`,
  {pc:closeModal,pe:()=>{S.over={k:'peace',t:'緊張緩和',d:'抑止が機能し、海に静けさが戻った。'};S.pending=null;save();render();mq.length=0;showOver();}});}
function showFiscal(f){const p=a=>Math.round(askChance(a)*100);
  modal(`<div class="alert">${dateStr(S.month)}　年度替わり</div><h2>新年度の防衛予算</h2><dl class="kv2"><dt>前年度</dt><dd>${f.old.toLocaleString()} 億円</dd><dt>今年度の内示</dt><dd><b>${S.budget.toLocaleString()} 億円</b>(月 ${income()} 億円)</dd>${f.cut?`<dt>査定減</dt><dd class="am">使い残しが多く、${f.cut}億円を削られた</dd>`:''}<dt>定期異動</dt><dd>${f.pr.join('<br>')}</dd></dl>
  <p class="sm mut">内示を受け入れるか、増額を求めるか。通れば増えるが、退けられると内示から2%減り、支持率も下がる。</p>
  <div class="mbtn"><button class="btn pri" data-m="a0">内示を受け入れる</button><button class="btn" data-m="a1">5%の増額を求める(成算 ${p(.05)}%)</button><button class="btn" data-m="a2">12%の増額を求める(成算 ${p(.12)}%)</button><button class="btn" data-m="a3">25%の増額を求める(成算 ${p(.25)}%)</button></div>`,
  {a0:closeModal,a1:()=>A.ask(.05),a2:()=>A.ask(.12),a3:()=>A.ask(.25)});}

/* ---------- タイトルとカスタムスタート ---------- */
function begin(cfg){newGame(cfg);save();ui.tab='home';render();showHelp();}
function showTitle(){const has=!!load();mq.length=0;
  modal(`<div class="alert">機動護衛群司令部</div><h2 class="big">蒼海の盾</h2><p class="sm">現代の海で、艦隊の指揮と運営を担う。撃たせず、撃たずに守り抜けるか。</p>${has?'<p class="sm mut">新しく始めると、いまの記録は上書きされる。</p>':''}<div class="mbtn">${has?`<button class="btn pri" data-m="c">続きから</button>`:''}<button class="btn ${has?'':'pri'}" data-m="s">標準の設定で始める</button><button class="btn" data-m="k">カスタムスタート</button></div>`,
  {c:()=>{closeModal();S=load();_M=null;_PM=null;render();if(S.over)showOver();else if(S.pending)showIncident();},s:()=>{closeModal();begin({});},k:()=>{closeModal();ui.cs=JSON.parse(JSON.stringify(DEFCFG));showSetup();}});}
function showSetup(){const c=ui.cs,f=c.fleet;
  const st=(k,lbl,step,min,max,unit)=>`<div class="srow"><label>${lbl}</label><div class="stp"><button onclick="A.cs('${k}',${-step},${min},${max})" aria-label="${lbl}を減らす">－</button><span>${c[k].toLocaleString()}${unit||''}</span><button onclick="A.cs('${k}',${step},${min},${max})" aria-label="${lbl}を増やす">＋</button></div></div>`;
  const fs=(k,lbl,step,max)=>`<div class="srow"><label>${lbl}</label><div class="stp"><button onclick="A.csf('${k}',${-step},${max})" aria-label="${lbl}を減らす">－</button><span>${f[k]||0}</span><button onclick="A.csf('${k}',${step},${max})" aria-label="${lbl}を増やす">＋</button></div></div>`;
  const sg2=(k,lbl,opts)=>`<div class="srow col"><label>${lbl}</label><div class="seg">${opts.map(o=>`<button class="${c[k]===o[0]?'on':''}" onclick="A.css('${k}',${o[0]})">${o[1]}</button>`).join('')}</div></div>`;
  let up=0,crew=0,val=0;for(const k of['cv','cvl','ddg','dd','ffm','ss','opv','aoe']){const n=f[k]||0;up+=PT[k].up*n;crew+=PT[k].crew*n;val+=PT[k].val*n;}
  const html=`<div class="alert">カスタムスタート</div><h2>任期の条件を決める</h2><div class="brow">${PRESET.map((p,i)=>`<button class="btn sm" onclick="A.csp(${i})">${p[0]}</button>`).join('')}</div>
  <h3 class="sub">名前</h3>
  <div class="srow"><label>司令官</label><input value="${esc(c.cmdr)}" placeholder="(任意)" oninput="ui.cs.cmdr=this.value" maxlength="16" aria-label="司令官の名前"></div>
  <div class="srow"><label>国名</label><input value="${esc(c.nation)}" oninput="ui.cs.nation=this.value" maxlength="12" aria-label="国名"></div>
  <div class="srow"><label>部隊名</label><input value="${esc(c.fleetName)}" oninput="ui.cs.fleetName=this.value" maxlength="16" aria-label="部隊名"></div>
  <h3 class="sub">期間と敵</h3>
  ${sg2('years','任期',[[5,'5年'],[10,'10年'],[20,'20年'],[30,'30年']])}${sg2('eGrow','敵の軍拡',[[.6,'緩やか'],[1,'標準'],[1.5,'急速'],[2,'苛烈']])}${sg2('eAggr','敵の攻撃性',[[.7,'慎重'],[1,'標準'],[1.4,'攻撃的']])}${sg2('incF','事案の頻度',[[.6,'少ない'],[1,'標準'],[1.6,'多い']])}
  <h3 class="sub">政治と予算</h3>
  ${st('budget','年間の防衛予算',400,2400,24000,' 億円')}${st('funds','手持ちの資金',200,0,30000,' 億円')}${st('tension','緊張度',5,5,85,'%')}${st('support','支持率',5,25,85,'%')}
  ${sg2('prePen','先制攻撃への非難',[[.5,'緩い'],[1,'標準'],[1.6,'厳しい']])}${sg2('sandbox','資金',[[false,'通常'],[true,'無制限']])}
  <h3 class="sub">艦隊</h3>
  ${fs('cv','多用途航空母艦',1,3)}${fs('cvl','航空護衛艦',1,4)}${fs('ddg','ミサイル護衛艦',1,8)}${fs('dd','汎用護衛艦',1,10)}${fs('ffm','多機能護衛艦',1,10)}${fs('ss','潜水艦',1,8)}${fs('opv','哨戒艦',1,8)}${fs('aoe','補給艦',1,3)}${fs('ftr','艦上戦闘機',2,60)}${fs('aew','早期警戒機',1,6)}
  <p class="sm mut">維持費 月${up}億円、乗員 ${crew.toLocaleString()}名、戦力値 ${val}(標準は 590)。空母に積みきれない機体は予備機になる。</p>
  ${st('tr','初期の練度',5,35,90,'')}
  <h3 class="sub">技術と増援</h3>

  if(!B.paused&&!B.over){let g=real*B.speed;while(g>1e-6&&!B.over){const d=Math.min(.1,g);step(d);g-=d;}}

  if(by==='E'){banner('敵が攻撃を開始　防衛出動発令','r');blog('敵の武力攻撃を確認。防衛出動が発令された。武器の使用は自由','r');if(B.speed>1)setSpeed(1);}

  if(t.cat==='air')blog(`${t.name} 全機喪失`,t.side==='P'?'r':'g');
  else{blog(`${t.name} ${t.side==='P'?'沈没':'を撃沈'}`,t.side==='P'?'r':'g');if(t.side==='P')banner(`${t.name} 沈没`,'r');else if(B.eWd)B.pursuitK++;}

function withdraw(why){if(B.eWd)return;B.eWd=true;B.pend=B.pend.filter(p=>!p.sp);blog(`敵部隊が撤退を始めた(${why})`,'g');banner('敵部隊　撤退開始','g');

  const n=e.role==='bmr'?e.asm:Math.min(e.asm,4),wt=tg.map(p=>p.cvf?3:p.sam>=60?2:1),sum=wt.reduce((a,b)=>a+b,0);

function egress(e){e.dx=e.sx;e.dy=e.sy;if(dist(e,{x:e.sx,y:e.sy})<8){e.dead=true;e.esc=true;B.sel=B.sel.filter(i=>i!==e.id);if(B.tsel===e.id)B.tsel=null;}}
function aiThink(){

  if(!B.eWd){
    if(B.eLost>=B.eInit*.5&&B.eLost>0)withdraw('損害甚大');
    else if(B.sc==='landing'&&!E.some(e=>e.key==='elst'))withdraw('揚陸部隊を喪失');
    else if(B.t>B.tmax)withdraw('作戦限界');
    else if(B.hot&&(B.sc==='airraid'||B.sc==='intrusion')&&!sp&&!E.some(e=>e.asm>0||(e.role==='cv'&&e.air>0)))withdraw('弾薬を消耗');
    else if(B.sc==='intrusion'&&!B.hot&&B.zoneT>90){B.intruded=true;withdraw('示威を終えて引き揚げ');}}

    if(B.eWd){egress(e);continue;}
    switch(e.role){
      case'lst':if(dist(e,B.obj)>4){e.dx=B.obj.x;e.dy=B.obj.y;}break;
      case'guard':e.dx=e.dy=null;tryFire(e,seenP);break;
      case'surf':{let tx,ty;const l=E.find(x=>x.key==='elst');
        if(l){tx=l.x+e.fx;ty=l.y+e.fy;}else if(B.hot||B.sc==='airraid'){tx=B.intel.x;ty=B.intel.y;}else{tx=B.obj.x+e.ox;ty=B.obj.y+e.oy;}
        e.dx=clamp(tx,4,W-4);e.dy=clamp(ty,4,H-4);tryFire(e,seenP);break;}
      case'bmr':if(e.asm>0){if(dist(e,B.intel)<15&&flag)B.intel={x:flag.x,y:flag.y};e.dx=B.intel.x;e.dy=B.intel.y;tryFire(e,seenP);}else egress(e);break;

          if(tg.length){const t=nearest(e,tg);fireTorp(e,t,Math.min(2,e.torp),'torp');e.torpCd=14;e.reveal=4;e.evade=10;const a=Math.atan2(e.y-t.y,e.x-t.x);e.dx=clamp(e.x+Math.cos(a)*30,5,W-5);e.dy=clamp(e.y+Math.sin(a)*30,5,H-5);blog('敵潜水艦が魚雷を発射','r');}}
        break;}
      case'cv':e.dx=e.dy=null;if(B.hot&&e.air>=2&&e.fireCd<=0){e.fireCd=22;e.air-=2;const fk=Math.random()<.5;mkE(fk?'eftr':'ebmr',e.x,e.y,fk?'ftr':'bmr',fk?{}:{asm:4,asmR:150});blog('敵空母から航空機が発艦','am');}break;}}}
function zoneStep(dt){const o=B.obj;let inz=false,land=false;
  for(const e of B.u){if(e.dead||e.side!=='E'||e.cat!=='ship')continue;const d=dist(e,o);if(d<o.r)inz=true;if(e.key==='elst'&&d<8)land=true;}

function step(dt){

  g.lineWidth=1;poly([[0,0],[W,0],[W,H],[0,H]],'#081a2a','#24445c');
  g.strokeStyle='#12304a';g.beginPath();for(let i=50;i<W;i+=50){line(i,0,0,i,H,0);line(0,i,0,W,i,0);}g.stroke();
  if(c.d<170){g.strokeStyle='#0c2438';g.beginPath();const x0=Math.max(0,Math.floor((c.tx-90)/10)*10),x1=Math.min(W,c.tx+90),y0=Math.max(0,Math.floor((c.ty-90)/10)*10),y1=Math.min(H,c.ty+90);

  const o=B.obj,rt=B.sc==='retake';ring(o.x,o.y,o.r,'#3b6a85',[4,4]);
  if(B.landT>0)ring(o.x,o.y,o.r*Math.min(1,B.landT/B.landNeed),'#ff6b5e');
  if(sel.length===1){const u=sel[0];ring(u.x,u.y,u.cat==='sub'?u.so:u.dS,'rgba(95,176,255,.45)',[2,4]);ring(u.x,u.y,u.samR,'rgba(99,219,160,.45)');ring(u.x,u.y,u.asmR,'rgba(242,181,74,.45)',[6,4]);if(u.aamR)ring(u.x,u.y,u.aamR,'rgba(99,219,160,.45)');}
  for(const u of sel){const p=pos3(u);if(u.dx!=null){g.strokeStyle='rgba(95,176,255,.55)';g.setLineDash([3,3]);g.beginPath();line(p[0],p[1],p[2],u.dx,u.dy,p[2]);g.stroke();g.setLineDash([]);}
    if(u.ord){const t=B.ui[u.ord.tgt];if(t){const q=t.seen?t:(t.ls||t);g.strokeStyle='rgba(255,107,94,.7)';g.beginPath();line(p[0],p[1],p[2],q.x,q.y,0);g.stroke();}}}
  // 面を集めて奥から描く
  const faces=[],LX=-.42,LY=-.36,LZ=.83;
  const addModel=(key,x,y,z,hd,scale,side,alpha)=>{const mk=MKEY[key]||['dd',1],fs=MDL[mk[0]],s=scale*mk[1],ch_=Math.cos(hd),sh=Math.sin(hd),pal=PAL[side];
    for(const f of fs){let dz=0;const pts=[];let bad=false;for(const q of f.p){const wx=x+(q[0]*ch_-q[1]*sh)*s,wy=y+(q[0]*sh+q[1]*ch_)*s,wz=z+q[2]*s,k=cam(wx,wy,wz);if(k[2]<NEAR){bad=true;break;}dz+=k[2];pts.push(cw/2+k[0]/k[2]*F,ch/2-k[1]/k[2]*F);}
      if(bad)continue;const nx=f.n[0]*ch_-f.n[1]*sh,ny=f.n[0]*sh+f.n[1]*ch_,it=.42+.58*Math.max(0,nx*LX+ny*LY+f.n[2]*LZ),b=pal[f.c];

      const it=.55+.45*((i*37)%7)/7,bc=rt?[120,64,56]:[52,92,66];faces.push({z:(q[0][2]+q[1][2]+q[2][2])/3,pts:[].concat(prj(q[0]),prj(q[1]),prj(q[2])),col:`rgb(${bc[0]*it|0},${bc[1]*it|0},${bc[2]*it|0})`});}}

  for(const v of vis){const u=v.u,E=u.side==='E',col=E?'#ff6b5e':'#5fb0ff',g0=P3(v.ghost?u.ls.x:u.x,v.ghost?u.ls.y:u.y,0);if(!g0)continue;
    g.globalAlpha=v.ghost?.4:.8;g.strokeStyle=col;g.lineWidth=1.2;g.beginPath();
    if(E){g.moveTo(g0[0],g0[1]-4);g.lineTo(g0[0]+7,g0[1]);g.lineTo(g0[0],g0[1]+4);g.lineTo(g0[0]-7,g0[1]);g.closePath();}else g.ellipse(g0[0],g0[1],7,4,0,0,6.3);g.stroke();
    if(!v.ghost&&u.cat!=='ship'){g.globalAlpha=.45;g.beginPath();g.moveTo(g0[0],g0[1]);g.lineTo(v.s[0],v.s[1]);g.stroke();}
    if(!v.ghost&&u.cat==='ship'&&u.dx!=null){g.globalAlpha=.25;g.strokeStyle='#cfe6f2';g.beginPath();const bx_=u.x-Math.cos(u.hd)*m*.5,by_=u.y-Math.sin(u.hd)*m*.5;for(const a of[.35,-.35])line(bx_,by_,0,bx_-Math.cos(u.hd+a)*m*1.3,by_-Math.sin(u.hd+a)*m*1.3,0);g.stroke();}
    g.globalAlpha=1;}
  faces.sort((a,b)=>b.z-a.z);g.lineWidth=.6;
  for(const f of faces){const p=f.pts;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fillStyle=f.col;g.strokeStyle=f.col;g.fill();g.stroke();}

/* ---------- 画面上の位置と操作 ---------- */
function scrOf(u){if(B.view==='3d'){if(!B.v3)return null;const p=pos3(u);return B.v3.P3(p[0],p[1],p[2]);}return[B.cw/2+(u.x-B.cam.x)*B.k,B.ch/2+(u.y-B.cam.y)*B.k];}
function seaAt(px,py){if(B.view!=='3d')return{x:B.cam.x+(px-B.cw/2)/B.k,y:B.cam.y+(py-B.ch/2)/B.k};const v=B.v3;if(!v)return null;const dx=px-B.cw/2,dy=-(py-B.ch/2);
  const wx=v.fx*v.F+v.rx*dx+v.ux*dy,wy=v.fy*v.F+v.ry*dx+v.uy*dy,wz=v.fz*v.F+v.uz*dy;if(wz>=-1e-6)return null;const t=-v.ez/wz;return{x:v.ex+wx*t,y:v.ey+wy*t};}
function tap(px,py){if(!B||B.over)return;let best=null,bd=B.view==='3d'?30:26;
  for(const u of B.u){if(u.dead||(u.side==='E'&&!u.seen))continue;const s=scrOf(u);if(!s)continue;const d=Math.hypot(s[0]-px,s[1]-py);if(d<bd){bd=d;best=u;}}
  if(best){if(best.side==='P'){if(B.sel.length===1&&B.sel[0]===best.id)B.sel=[];else B.sel=[best.id];}else B.tsel=B.tsel===best.id?null:best.id;}
  else{const w=seaAt(px,py);if(selUnits().length){if(w&&w.x>=0&&w.x<=W&&w.y>=0&&w.y<=H)cmdMove(w.x,w.y);}else{B.tsel=null;if(w&&B.view==='3d'){B.c3.tx=clamp(w.x,0,W);B.c3.ty=clamp(w.y,0,H);}}}
  uiRefresh(true);}
function pan3(dx,dy){const c=B.c3,k=c.d/(B.v3?B.v3.F:300),sy=Math.sin(c.yaw),cy=Math.cos(c.yaw),sp=Math.max(.25,Math.sin(c.pit));
  c.tx=clamp(c.tx+(-cy*dx-sy*dy/sp)*k,-40,W+40);c.ty=clamp(c.ty+(sy*dx-cy*dy/sp)*k,-40,H+40);}
function initDOM(){
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.t;render();window.scrollTo(0,0);});
  $('#next').addEventListener('click',nextMonth);
  $('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||b.disabled||!mq.length)return;const f=mq[0].cbs[b.dataset.m];if(f)f();else closeModal();});
  $('#bspd').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&B&&!B.over)setSpeed(+b.dataset.s);});
  $('#bact').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b&&!b.disabled)bact(b.dataset.a);});
  $('#bquit').addEventListener('click',()=>{if(!B||B.over)return;const was=B.paused;B.paused=true;
    confirmM(B.drill?'演習を打ち切る。':'海域から撤退する。事案は失敗として扱われる。',()=>finish('lose',{retreat:true}),'撤退する',()=>{if(!was)setSpeed(B.speed);});});
  document.querySelector('.zoom').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!B)return;const z=b.dataset.z;
    if(z==='v')return setView(B.view==='3d'?'2d':'3d');
    if(z==='f'){B.fol=!B.fol;if(B.fol&&!selUnits().length)toast('追尾する部隊を選ぶこと');return setView(B.view);}
    if(z==='0'){B.cam={x:W/2,y:H/2,z:1};B.c3=Object.assign({},C3DEF);B.fol=false;return setView(B.view);}
    if(B.view==='3d')B.c3.d=clamp(B.c3.d*(+z>0?1/1.4:1.4),8,900);else B.cam.z=clamp(B.cam.z*(+z>0?1.4:1/1.4),1,8);});
  const cv=$('#cv'),pts=new Map();let moved=false,start=null,pd=0,pm=null;
  const mid=()=>{const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};};
  const begin1=(x,y,e)=>{start={x,y,cx:B.cam.x,cy:B.cam.y,yaw:B.c3.yaw,pit:B.c3.pit,lx:x,ly:y,pan:!!e&&(e.shiftKey||e.button===2)};};

      if(B.view==='3d'){if(start.pan){pan3(e.offsetX-start.lx,e.offsetY-start.ly);start.lx=e.offsetX;start.ly=e.offsetY;}else{B.c3.yaw=start.yaw-dx*.006;B.c3.pit=clamp(start.pit+dy*.005,.1,1.52);}}
      else{B.cam.x=clamp(start.cx-dx/B.k,0,W);B.cam.y=clamp(start.cy-dy/B.k,0,H);}}
    else if(pts.size===2){const q=mid();if(B.view==='3d'){if(pd>0)B.c3.d=clamp(B.c3.d*pd/q.d,8,900);if(pm)pan3(q.x-pm.x,q.y-pm.y);}else if(pd>0)B.cam.z=clamp(B.cam.z*q.d/pd,1,8);pd=q.d;pm=q;}});

    if(pts.size===1){const p=[...pts.values()][0];begin1(p.x,p.y);moved=true;}else if(pts.size===0){start=null;pm=null;}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  window.addEventListener('error',e=>{try{toast('エラー: '+(e.message||''));}catch(_){}});
}
initDOM();
S=load();
if(S){render();if(S.over)showOver();else if(S.pending)showIncident();}
else{newGame({});render();showTitle();}
